name: Temporary Worker Support Window Fix
on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Lock Worker support window to 72 hours
        shell: python
        run: |
          from pathlib import Path
          path = Path('supabase/migrations/20260914084537_worker_support_window_and_auth_grants.sql')
          text = path.read_text()
          count = text.count("24 hours")
          if count < 4:
              raise SystemExit(f'expected Worker support 24-hour contract occurrences, found {count}')
          text = text.replace("24 hours", "72 hours")
          path.write_text(text)
      - name: Commit support-window repair
        run: |
          git config user.name "WeHouse Lifecycle Repair"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations/20260914084537_worker_support_window_and_auth_grants.sql
          git commit -m "Honor 72-hour Worker support window"
          git rm .github/workflows/temporary-worker-support-window-fix.yml
          git commit -m "Remove completed Worker support-window repair workflow"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914