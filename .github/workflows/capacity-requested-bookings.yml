name: 500k profile and one-million property capacity (disposable)
on:
  pull_request:
    paths:
      - '.github/workflows/capacity-requested-bookings.yml'
      - 'scripts/seed-capacity-scale.sh'
      - 'scripts/load-catalog-scale.mjs'
      - 'scripts/load-requested-bookings-local.mjs'
      - 'supabase/tests/capacity_requested_booking_fixture.sql'
      - 'supabase/tests/capacity_scale_*.sql'
      - 'supabase/migrations/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-catalog-and-bookings:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require disposable runner space
        run: test "$(df -BG --output=avail / | tail -1 | tr -dc '0-9')" -ge 16
      - name: Start local Supabase and replay migrations
        run: |
          npx --yes supabase@2.114.0 start
          npx --yes supabase@2.114.0 db reset --local
      - name: Seed 500,000 profiles and exactly one million properties
        run: WEHOUSE_CAPACITY_PRESET=launch bash scripts/seed-capacity-scale.sh
      - name: Seed hotel rates and physical room units
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/capacity_requested_booking_fixture.sql
      - name: Size local gateway for the booking burst
        run: |
          docker exec -e KONG_NGINX_EVENTS_WORKER_CONNECTIONS=4096 supabase_kong_wehouse kong reload
          docker exec supabase_kong_wehouse cat /usr/local/kong/nginx.conf | grep -Eq 'worker_connections[[:space:]]+4096;'
      - name: Record hotel query execution plans
        run: node scripts/explain-capacity-hotels.mjs
      - name: Measure catalog reads
        run: WEHOUSE_CAPACITY_PRESET=launch node scripts/load-catalog-scale.mjs
      - name: Attempt 600 and 3000 distinct-user booking bursts
        run: WEHOUSE_CAPACITY_PRESET=launch node scripts/load-requested-bookings-local.mjs
      - name: Record database cardinality and storage
        if: always()
        run: |
          docker exec supabase_db_wehouse psql -U postgres -d postgres -Atc "select pg_database_size(current_database()),(select count(*) from public.listings where listing_id like 'load-home-scale-%'),(select count(*) from public.hotels where hotel_id between -5000000 and -1000001),(select count(*) from public.profiles where user_id like 'load-user-%')" > test-results/requested-database-counts.txt || true
      - name: Retain local resource and gateway evidence
        if: always()
        run: |
          mkdir -p test-results
          df -h / > test-results/requested-runner-space.txt
          docker stats --no-stream > test-results/requested-container-stats.txt || true
          for container in supabase_kong_wehouse supabase_rest_wehouse supabase_db_wehouse supabase_auth_wehouse; do
            docker logs --tail 500 "$container" > "test-results/$container.log" 2>&1 || true
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: requested-catalog-booking-results
          path: |
            test-results/catalog-scale.json
            test-results/requested-bookings.json
            test-results/requested-*.txt
            test-results/supabase_*.log
          retention-days: 14
      - name: Destroy disposable services
        if: always()
        run: npx --yes supabase@2.114.0 stop --no-backup
