name: Isolated repair source
on:
  pull_request:
    paths:
      - '.github/workflows/repair-source-evidence.yml'
permissions:
  contents: read
jobs:
  source:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Archive tracked source and locked dependencies
        run: |
          git archive --format=tar -o "${RUNNER_TEMP}/repair-source.tar" HEAD
          tar -czf "${RUNNER_TEMP}/repair-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: isolated-repair-source
          path: |
            ${{ runner.temp }}/repair-source.tar
            ${{ runner.temp }}/repair-dependencies.tar.gz
          retention-days: 1
