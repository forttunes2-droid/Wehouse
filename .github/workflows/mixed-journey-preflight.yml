name: Isolated mixed journey preflight
on:
  pull_request:
    paths:
      - .github/workflows/mixed-journey-preflight.yml
      - scripts/load-mixed-journeys-local.mjs
      - scripts/lib/friend-live-probe.mjs
      - scripts/lib/authenticator-probe.mjs
      - scripts/check-local-auth-rate-limit.mjs
      - supabase/config.toml
      - supabase/tests/mixed_journey_fixture.sql
      - supabase/migrations/**
      - src/lib/supabase/**
      - src/pages/MyReservations.tsx
      - src/components/PropertyInspectionRequestPanel.tsx
      - src/components/WorkerShowcaseManager.tsx
      - src/lib/mediaVideo.ts
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: wehouse-mixed-journeys-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  local-mixed-journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ad077b4817fff9ecc3c1fd20d271ec351e2d7244 # v1.7.0
        with:
          version: 2.114.0
      - run: supabase --version
      - run: npm ci
      - name: Start disposable Supabase
        run: node scripts/disposable-supabase.mjs start
      - name: Apply all migrations to an empty local database
        run: node scripts/disposable-supabase.mjs reset
      - name: Verify disposable database broadcast readiness
        run: node scripts/prime-local-realtime.mjs
      - name: Seed synthetic catalog and rates
        run: |
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/load_baseline_fixture.sql
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/mixed_journey_fixture.sql
      - name: Run real Auth and mixed HTTP journeys
        run: node scripts/load-mixed-journeys-local.mjs
      - name: Verify direct Auth password cooldown and recovery on loopback
        run: node scripts/check-local-auth-rate-limit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-journey-preflight
          path: |
            test-results/mixed-journeys-local.json
            test-results/media-upload-local.json
            test-results/authenticator-local.json
          retention-days: 7
      - name: Stop disposable Supabase
        if: always()
        run: supabase stop --no-backup
