name: Supabase schema baseline validation

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-db-password-check.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  schema-export:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify secret exists
        shell: bash
        run: test -n "$PGPASSWORD"
      - name: Verify read-only connection
        shell: bash
        run: |
          psql "host=aws-1-eu-north-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.rkrhnkhppeihvmuwvsvn sslmode=require connect_timeout=15" \
            -v ON_ERROR_STOP=1 -c "select 1 as connection_ok;"
      - name: Export public schema only
        shell: bash
        run: |
          docker run --rm \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            pg_dump \
              --host=aws-1-eu-north-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.rkrhnkhppeihvmuwvsvn \
              --dbname=postgres \
              --schema=private \
              --schema=public \
              --schema-only \
              --no-owner \
              --no-comments \
              --format=plain \
            > wehouse-public-schema.sql
          grep -v '^[\\]' wehouse-public-schema.sql > wehouse-public-schema.clean.sql
          mv wehouse-public-schema.clean.sql wehouse-public-schema.sql
          sed -i '/^CREATE SCHEMA public;$/d' wehouse-public-schema.sql
          sed -i '/^ALTER DEFAULT PRIVILEGES /d' wehouse-public-schema.sql
          test -s wehouse-public-schema.sql
          sha256sum wehouse-public-schema.sql
      - name: Validate baseline from an empty local Supabase database
        shell: bash
        run: |
          mkdir -p /tmp/wehouse-legacy-migrations
          find supabase/migrations -maxdepth 1 -type f -name '*.sql' -exec mv {} /tmp/wehouse-legacy-migrations/ \;
          cp wehouse-public-schema.sql supabase/migrations/20250525000000_remote_schema.sql
          psql "host=aws-1-eu-north-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.rkrhnkhppeihvmuwvsvn sslmode=require" \
            -v ON_ERROR_STOP=1 -At -F '|' \
            -c "select version, coalesce(nullif(regexp_replace(name, '[^a-zA-Z0-9_]+', '_', 'g'), ''), 'applied') from supabase_migrations.schema_migrations where version <> '20250525000000' order by version" |
          while IFS='|' read -r version migration_name; do
            printf '%s\n' '-- Historical production migration; schema is included in 20250525000000_remote_schema.sql.' \
              > "supabase/migrations/${version}_${migration_name}.sql"
          done
          npx --yes supabase@2.114.0 start
          npx --yes supabase@2.114.0 db reset --local
          test "$(docker exec supabase_db_wehouse psql -U postgres -d postgres -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")" -ge 90
          test "$(docker exec supabase_db_wehouse psql -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';")" -ge 280
          npx --yes supabase@2.114.0 stop --no-backup
      - name: Install validated baseline and archive legacy SQL
        shell: bash
        run: |
          mkdir -p supabase/migrations_legacy
          find /tmp/wehouse-legacy-migrations -maxdepth 1 -type f -name '*.sql' ! -name '20250525000000_remote_schema.sql' -exec mv {} supabase/migrations_legacy/ \;
          git config user.name "wehouse-schema-bot"
          git config user.email "actions@users.noreply.github.com"
          git add supabase/migrations supabase/migrations_legacy
          if git diff --cached --quiet; then
            echo "Migration baseline is already synchronized."
          else
            git commit -m "fix(supabase): reconcile remote migration history"
            git push
          fi
      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: wehouse-public-schema
          path: wehouse-public-schema.sql
          if-no-files-found: error
          retention-days: 1
