name: Supabase schema-only export

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-db-password-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: test -n "$PGPASSWORD"
      - name: Verify read-only connection
        shell: bash
        run: |
          psql "host=aws-1-eu-north-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.rkrhnkhppeihvmuwvsvn sslmode=require connect_timeout=15" \
            -v ON_ERROR_STOP=1 -c "select 1 as connection_ok;"
      - name: Export public schema only
        shell: bash
        run: |
          docker run --rm \
            -e PGPASSWORD="$PGPASSWORD" \
            postgres:17 \
            pg_dump \
              --host=aws-1-eu-north-1.pooler.supabase.com \
              --port=5432 \
              --username=postgres.rkrhnkhppeihvmuwvsvn \
              --dbname=postgres \
              --schema=public \
              --schema-only \
              --no-owner \
              --no-comments \
              --format=plain \
            > wehouse-public-schema.sql
          sed -i '/^\\\\restrict /d;/^\\\\unrestrict /d' wehouse-public-schema.sql
          sed -i '/^CREATE SCHEMA public;$/d' wehouse-public-schema.sql
          test -s wehouse-public-schema.sql
          sha256sum wehouse-public-schema.sql
      - name: Upload schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: wehouse-public-schema
          path: wehouse-public-schema.sql
          if-no-files-found: error
          retention-days: 1
