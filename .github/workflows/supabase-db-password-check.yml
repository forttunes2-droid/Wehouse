name: Supabase database password check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-db-password-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: |
          test -n "$PGPASSWORD"
      - name: Test read-only database connection
        shell: bash
        run: |
          psql "host=aws-0-eu-north-1.pooler.supabase.com port=5432 dbname=postgres user=postgres.rkrhnkhppeihvmuwvsvn sslmode=require connect_timeout=15" \
            -v ON_ERROR_STOP=1 \
            -c "select 1 as connection_ok;"
