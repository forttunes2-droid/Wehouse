name: Supabase database password check

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/supabase-db-password-check.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Verify secret exists
        shell: bash
        run: test -n "$PGPASSWORD"
      - name: Test read-only database connection
        shell: bash
        run: |
          set +e
          for host in aws-1-eu-north-1.pooler.supabase.com aws-0-eu-north-1.pooler.supabase.com db.rkrhnkhppeihvmuwvsvn.supabase.co; do
            if [ "$host" = "db.rkrhnkhppeihvmuwvsvn.supabase.co" ]; then
              user="postgres"
            else
              user="postgres.rkrhnkhppeihvmuwvsvn"
            fi
            output=$(psql "host=$host port=5432 dbname=postgres user=$user sslmode=require connect_timeout=10" -v ON_ERROR_STOP=1 -c "select 1 as connection_ok;" 2>&1)
            result=$?
            if [ $result -eq 0 ]; then
              echo "Connection succeeded using the official project endpoint."
              exit 0
            fi
            echo "$output" | sed -E 's/(password authentication failed).*/\1/' | tail -n 1
          done
          exit 1
