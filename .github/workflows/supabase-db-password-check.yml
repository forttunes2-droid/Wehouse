name: Supabase coordinated release

# Manual, audited use of the existing production database secret. This replaces
# the obsolete job that rewrote migration history and pushed directly to main.
on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: Check and roll back, or commit the verified database upgrade
        type: choice
        options: [check, apply]
        default: check
        required: true
      expected_sha:
        description: Full reviewed commit SHA with both required checks passing
        type: string
        required: true

permissions:
  contents: read
  checks: read

concurrency:
  group: wehouse-production-database-release
  cancel-in-progress: false

jobs:
  release:
    if: github.actor == 'forttunes2-droid'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require the exact reviewed commit and passing checks
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$EXPECTED_SHA" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/check-runs?per_page=100" > /tmp/wehouse-release-checks.json
          python - <<'PYCODE'
          import json
          checks=json.load(open('/tmp/wehouse-release-checks.json'))['check_runs']
          for name in ['WeHouse Build Check','Consolidation Validation']:
              matches=[r for r in checks if r['name']==name and r['app']['id']==15368]
              assert matches, 'Missing required GitHub Actions check: '+name
              latest=max(matches,key=lambda r:r['id'])
              assert latest['status']=='completed' and latest['conclusion']=='success', 'Required check has not passed: '+name
          print('Both required checks passed for the selected commit.')
          PYCODE
      - name: Run the coordinated database upgrade
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PGHOST: aws-1-eu-north-1.pooler.supabase.com
          PGPORT: '5432'
          PGDATABASE: postgres
          PGUSER: postgres.rkrhnkhppeihvmuwvsvn
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: '15'
          RELEASE_MODE: ${{ inputs.release_mode }}
        run: |
          test -n "$PGPASSWORD"
          python scripts/coordinated-database-release.py "$RELEASE_MODE"
