name: Temporary Property Conversation Continuity Fix
on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
    paths:
      - scripts/temporary_property_conversation_continuity_fix.py
      - .github/workflows/temporary-property-conversation-continuity-fix.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - name: Restore canonical property conversation continuity
        run: python scripts/temporary_property_conversation_continuity_fix.py
      - name: Remove temporary repair files
        run: |
          rm scripts/temporary_property_conversation_continuity_fix.py
          rm .github/workflows/temporary-property-conversation-continuity-fix.yml
      - name: Commit conversation continuity repair
        run: |
          git config user.name "WeHouse Conversation Continuity"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/supabase/support.ts src/pages/MyReservations.tsx src/pages/HotelDetailExperience.tsx supabase/migrations/20260916123000_atomic_wehouse_first_send_and_support_storage.sql tests/property-conversation-continuity.test.mjs scripts/temporary_property_conversation_continuity_fix.py .github/workflows/temporary-property-conversation-continuity-fix.yml
          git commit -m "Preserve property Message WeHouse continuity" || exit 0
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
