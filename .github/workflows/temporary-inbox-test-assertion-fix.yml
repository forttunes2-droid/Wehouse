name: Temporary Inbox Assertion Fix

on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
    paths:
      - .github/workflows/temporary-inbox-test-assertion-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - name: Correct brittle Inbox assertions
        run: python scripts/temporary_inbox_test_assertion_fix.py
      - name: Commit assertion correction
        run: |
          git config user.name "WeHouse Test Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Correct canonical Inbox test assertions"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
