name: Temporary Property Conversation Continuity Fix V2
on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
    paths:
      - scripts/temporary_property_conversation_continuity_fix_v2.py
      - .github/workflows/temporary-property-conversation-continuity-fix-v2.yml
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - name: Restore canonical property conversation continuity
        run: python scripts/temporary_property_conversation_continuity_fix_v2.py
      - name: Remove temporary repair files
        run: |
          rm -f scripts/temporary_property_conversation_continuity_fix.py
          rm -f .github/workflows/temporary-property-conversation-continuity-fix.yml
          rm -f scripts/temporary_property_conversation_continuity_fix_v2.py
          rm -f .github/workflows/temporary-property-conversation-continuity-fix-v2.yml
      - name: Commit conversation continuity repair
        run: |
          git config user.name "WeHouse Conversation Continuity"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Preserve property Message WeHouse continuity" || exit 0
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
