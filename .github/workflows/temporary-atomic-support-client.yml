name: Temporary Atomic Support Client

on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
    paths:
      - .github/workflows/temporary-atomic-support-client.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - name: Apply atomic Support client repair
        run: python scripts/temporary_atomic_support_client.py
      - name: Commit atomic Support client repair
        run: |
          git config user.name "WeHouse Support Integrity"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Use atomic first Send for WeHouse help"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
