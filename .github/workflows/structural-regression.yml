name: WeHouse structural regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "fix/next-structural-work-*"]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regression contracts
        run: npm test
      - name: TypeScript and production build
        run: npm run build
# CI ref recovery: harmless comment; keeps workflow behavior unchanged.
