name: Verify isolated profile refinement
on:
  push:
    branches: [codex/profile-help-refinement-20260924]
    paths: [.github/workflows/profile-refinement-apply.yml]
permissions:
  contents: write
concurrency:
  group: isolated-profile-refinement
  cancel-in-progress: true
jobs:
  verify:
    if: github.repository == 'forttunes2-droid/Wehouse' && github.ref == 'refs/heads/codex/profile-help-refinement-20260924'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retain payload for byte verification
        run: |
          mkdir -p /tmp/profile-refinement-evidence
          python - <<'PY'
          from pathlib import Path
          encoded=''.join(Path(f'.repair/profile-{i}.b64').read_text().strip() for i in range(1,10))
          Path('/tmp/profile-refinement-evidence/received.b64').write_text(encoded)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: profile-refinement-received
          path: /tmp/profile-refinement-evidence/received.b64
          retention-days: 1
      - name: Verify patch bytes and exact clean target
        run: |
          python - <<'PY'
          import base64,hashlib,lzma,pathlib,subprocess
          base='5e4accfafe00a1108317c2c56fa768f5acbcc8ea'
          target='453a700a393b439923e89772c540ebbaa4cee553'
          branch='codex/profile-help-verified-20260924'
          allowed={'.github/workflows/profile-refinement-source.yml','.github/workflows/profile-refinement-apply.yml',*[f'.repair/profile-{i}.b64' for i in range(1,10)]}
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          assert changed==allowed, f'Unexpected source staging changes: {changed ^ allowed}'
          encoded=pathlib.Path('/tmp/profile-refinement-evidence/received.b64').read_text()
          patch=lzma.decompress(base64.b64decode(encoded,validate=True))
          assert hashlib.sha256(patch).hexdigest()=='e73b29117432bf4a501ff70412d922518a6c0b705fe5705c09921a9ea2107f28', 'Patch differs from locally tested bytes'
          current=subprocess.check_output(['git','ls-remote','origin',f'refs/heads/{branch}'],text=True).split()[0]
          assert current==target, 'Target branch has changed; do not overwrite newer work'
          subprocess.run(['git','fetch','origin',f'refs/heads/{branch}'],check=True)
          subprocess.run(['git','checkout','--detach',target],check=True)
          subprocess.run(['git','apply','--check','--index'],input=patch,check=True)
          subprocess.run(['git','apply','--index'],input=patch,check=True)
          tree=subprocess.check_output(['git','write-tree'],text=True).strip()
          assert tree=='df50e4bf0f2904eb8dea855562b0c19c3a5c3b31', f'Final source tree mismatch: {tree}'
          pathlib.Path('/tmp/profile-refinement-evidence/tree.txt').write_text(tree)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Commit verified tree only to isolated target
        run: |
          test "$(git write-tree)" = df50e4bf0f2904eb8dea855562b0c19c3a5c3b31
          test "$(git ls-remote origin refs/heads/codex/profile-help-verified-20260924 | cut -f1)" = 453a700a393b439923e89772c540ebbaa4cee553
          git config user.name 'WeHouse repair review'
          git config user.email 'noreply@wehouse.com.ng'
          git commit -m 'Refine worker showcase, practical preferences and genuine Help records; recognise verified release boundary'
          git push origin HEAD:refs/heads/codex/profile-help-verified-20260924
          git rev-parse HEAD > /tmp/profile-refinement-evidence/commit.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: profile-refinement-verification
          path: /tmp/profile-refinement-evidence/
          retention-days: 1
