name: WeHouse Build Check

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wehouse-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: WeHouse Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Audit all dependencies
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npx tsc --noEmit
      - run: npm run build
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check recovery and sensitive Edge handlers
        run: |
          deno check --no-config supabase/functions/provider-password-recovery/index.ts supabase/functions/creator-security-setup/index.ts supabase/functions/creator-step-up/index.ts supabase/functions/payment-init/index.ts supabase/functions/payout-account/index.ts supabase/functions/payout-withdrawal/index.ts supabase/functions/paystack-verify/index.ts supabase/functions/property-earning-action/index.ts supabase/functions/worker-pro-manage/index.ts supabase/functions/worker-pro-payment-init/index.ts supabase/functions/worker-pro-plan-sync/index.ts
