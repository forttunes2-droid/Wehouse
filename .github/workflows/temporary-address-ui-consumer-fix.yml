name: Temporary address-only consumer repair
on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
permissions:
  contents: write
jobs:
  repair:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Patch Profile and Partner consumers
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/components/PropertyInspectionRequestPanel.tsx')
          s = p.read_text()
          old = '''  function setPreciseLocation(index: number, value: PreciseLocation | null) {
            if (!value) {
              patch(index, { latitude: "", longitude: "", location: null });
              return;
            }
            patch(index, {
              latitude: String(value.latitude),
              longitude: String(value.longitude),
              propertyAddress: value.address || drafts[index]?.propertyAddress || "",
              propertyCity: drafts[index]?.propertyCity || value.city || "",
              propertyState: drafts[index]?.propertyState || value.state || "",
              location: {
                lat: value.latitude,
                lon: value.longitude,
                accuracy: value.accuracy,
                source: "gps",
                address: value.address,
              },
            });
          }'''
          if old not in s:
              old = '''  function setPreciseLocation(index: number, value: PreciseLocation | null) {
              if (!value) {
                patch(index, { latitude: "", longitude: "", location: null });
                return;
              }
              patch(index, {
                latitude: String(value.latitude),
                longitude: String(value.longitude),
                propertyAddress: value.address || drafts[index]?.propertyAddress || "",
                propertyCity: drafts[index]?.propertyCity || value.city || "",
                propertyState: drafts[index]?.propertyState || value.state || "",
                location: {
                  lat: value.latitude,
                  lon: value.longitude,
                  accuracy: value.accuracy,
                  source: "gps",
                  address: value.address,
                },
              });
            }'''
          if old not in s:
              old = '''  function setPreciseLocation(index: number, value: PreciseLocation | null) {
    if (!value) {
      patch(index, { latitude: "", longitude: "", location: null });
      return;
    }
    patch(index, {
      latitude: String(value.latitude),
      longitude: String(value.longitude),
      propertyAddress: value.address || drafts[index]?.propertyAddress || "",
      propertyCity: drafts[index]?.propertyCity || value.city || "",
      propertyState: drafts[index]?.propertyState || value.state || "",
      location: {
        lat: value.latitude,
        lon: value.longitude,
        accuracy: value.accuracy,
        source: "gps",
        address: value.address,
      },
    });
  }'''
          new = '''  function setPreciseLocation(index: number, value: PreciseLocation | null) {
    if (!value) {
      patch(index, { latitude: "", longitude: "", location: null });
      return;
    }
    const hasCoordinates = value.latitude != null && value.longitude != null;
    patch(index, {
      latitude: hasCoordinates ? String(value.latitude) : "",
      longitude: hasCoordinates ? String(value.longitude) : "",
      propertyAddress: value.address || drafts[index]?.propertyAddress || "",
      propertyCity: drafts[index]?.propertyCity || value.city || "",
      propertyState: drafts[index]?.propertyState || value.state || "",
      location: hasCoordinates
        ? {
            lat: value.latitude as number,
            lon: value.longitude as number,
            accuracy: value.accuracy,
            source: "gps",
            address: value.address,
          }
        : null,
    });
  }'''
          if old not in s:
              raise SystemExit('Property precise-location block not found')
          p.write_text(s.replace(old, new))

          p = Path('src/pages/ProfileEditAccount.tsx')
          s = p.read_text()
          s = s.replace(
            "const [preciseLocation,setPreciseLocation]=useState<PreciseLocation|null>(()=>profile.precise_latitude!=null&&profile.precise_longitude!=null?{latitude:Number(profile.precise_latitude),longitude:Number(profile.precise_longitude),accuracy:profile.precise_location_accuracy_m==null?null:Number(profile.precise_location_accuracy_m),address:profile.precise_address||''}:null);",
            "const [preciseLocation,setPreciseLocation]=useState<PreciseLocation|null>(()=>profile.precise_address||profile.precise_latitude!=null&&profile.precise_longitude!=null?{latitude:profile.precise_latitude==null?null:Number(profile.precise_latitude),longitude:profile.precise_longitude==null?null:Number(profile.precise_longitude),accuracy:profile.precise_location_accuracy_m==null?null:Number(profile.precise_location_accuracy_m),address:profile.precise_address||''}:null);"
          )
          s = s.replace(
            "Object.assign(current,{state,lga,preciseLocation});Object.assign(original,{state:profile.state||'',lga:profile.local_government||profile.city||'',preciseLocation:profile.precise_latitude!=null&&profile.precise_longitude!=null?{latitude:Number(profile.precise_latitude),longitude:Number(profile.precise_longitude),accuracy:profile.precise_location_accuracy_m==null?null:Number(profile.precise_location_accuracy_m),address:profile.precise_address||''}:null});",
            "Object.assign(current,{state,lga,preciseLocation});Object.assign(original,{state:profile.state||'',lga:profile.local_government||profile.city||'',preciseLocation:profile.precise_address||profile.precise_latitude!=null&&profile.precise_longitude!=null?{latitude:profile.precise_latitude==null?null:Number(profile.precise_latitude),longitude:profile.precise_longitude==null?null:Number(profile.precise_longitude),accuracy:profile.precise_location_accuracy_m==null?null:Number(profile.precise_location_accuracy_m),address:profile.precise_address||''}:null});"
          )
          s = s.replace("The map suggested ", "The phone suggested ")
          s = s.replace("<ProfileFact label=\"Exact address\" value={preciseLocation ? 'Saved privately' : 'Not added'} />", "<ProfileFact label=\"Street address\" value={preciseLocation?.address?.trim() || 'Not added'} />")
          s = s.replace("State and Local Government set your WeHouse region. Use your phone location below to find and confirm one private street address.", "State and Local Government set your WeHouse region. Type your actual street address below. Phone location is optional assistance; technical coordinates are not shown in the app.")
          s = s.replace("Precise address cleared because the region changed. Use your location again if you want to save it.", "Street address cleared because the region changed. Type the correct address for the new region.")
          s = s.replace("Precise address cleared because the LGA changed. Use your location again if you want to save it.", "Street address cleared because the LGA changed. Type the correct address for the new LGA.")
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/temporary-address-ui-consumer-fix.yml
          git config user.name "WeHouse Address UI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PropertyInspectionRequestPanel.tsx src/pages/ProfileEditAccount.tsx .github/workflows/temporary-address-ui-consumer-fix.yml
          git commit -m "Keep Profile and Partner location address-only"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914