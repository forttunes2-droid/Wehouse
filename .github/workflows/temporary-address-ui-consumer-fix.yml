name: Temporary address consumer repair
on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Apply patch
        run: python .github/scripts/temporary_address_ui_consumer_fix.py
      - name: Clean up and commit
        run: |
          rm .github/workflows/temporary-address-ui-consumer-fix.yml
          rm .github/scripts/temporary_address_ui_consumer_fix.py
          git config user.name "WeHouse Address UI Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Keep Profile and Partner location address-only"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914