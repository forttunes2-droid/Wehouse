name: Temporary routing and location repair

on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
    paths: [.github/workflows/temporary-routing-location-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply bounded source repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f"expected source not found in {path}: {old[:100]!r}")
              s=s.replace(old,new,count)
              p.write_text(s)

          # Customer Help exists only in Personal, Service Provider and Property Partner workspaces.
          replace('src/pages/AccountCenter.tsx',
              '  const role = profile.role;\n  const isUser = role === "user";',
              '  const role = profile.role;\n  const canOpenCustomerHelp = ["user", "worker", "property_partner"].includes(role);\n  const isUser = role === "user";')
          replace('src/pages/AccountCenter.tsx',
              '  if (panel === "help")\n    return <AccountHelpCenter profile={profile} onBack={() => setPanel(null)} />;',
              '  if (panel === "help" && canOpenCustomerHelp)\n    return <AccountHelpCenter profile={profile} onBack={() => setPanel(null)} />;')
          replace('src/pages/AccountCenter.tsx',
              '''      <AccountSection title="Help">\n        <AccountRow\n          title="Help"\n          detail="General help, linked jobs, payments, payouts and safety or security concerns"\n          onClick={() => setPanel("help")}\n          icon={<ToolsIcon />}\n        />\n      </AccountSection>''',
              '''      {canOpenCustomerHelp ? (\n        <AccountSection title="Help">\n          <AccountRow\n            title="Help"\n            detail="General help, linked jobs, payments, payouts and safety or security concerns"\n            onClick={() => setPanel("help")}\n            icon={<ToolsIcon />}\n          />\n        </AccountSection>\n      ) : null}''')

          # A Property Partner submission/inspection question is a structured Property Operations case.
          replace('src/components/PartnerSubmittedRequests.tsx',
              '''          category: "property_inspection",\n          subject: `Property inspection ${request.request_code || ""}`.trim(),\n          contextType: "property_inspection",\n          contextId: request.id,\n          contextSnapshot: {\n            request_code: request.request_code,\n            property_address: request.property_address,\n            property_type: request.property_type,\n            city: request.property_city,\n            state: request.property_state,\n            status: request.status,\n          },''',
              '''          category: "property_submission_help",\n          subject: `Property submission ${request.request_code || ""}`.trim(),\n          contextType: "contextual_help",\n          contextId: request.id,\n          contextSnapshot: {\n            reason_code: "property_submission_help",\n            subject_type: "inspection",\n            source_type: "inspection",\n            source_id: request.id,\n            request_code: request.request_code,\n            property_address: request.property_address,\n            property_type: request.property_type,\n            city: request.property_city,\n            state: request.property_state,\n            status: request.status,\n          },''')

          # Discovery location may be sent to the server for distance calculation; supplier coordinates never return.
          replace('src/hooks/useDiscoveryLocation.ts',
              'import { useCallback, useEffect, useState } from "react";\n',
              'import { useCallback, useEffect, useState } from "react";\nimport { supabase } from "@/lib/supabase";\n')
          replace('src/hooks/useDiscoveryLocation.ts',
              '''export function directionsUrl(latitude: number, longitude: number) {\n  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`${latitude},${longitude}`)}&travelmode=driving`;\n}\n''',
              '''export async function getDiscoveryDistanceMap(\n  origin: Pick<DiscoveryLocation, "lat" | "lng"> | null,\n) {\n  const map = new Map<string, number>();\n  if (!origin) return map;\n  const { data, error } = await supabase.rpc("get_my_discovery_distances", {\n    p_lat: origin.lat,\n    p_lng: origin.lng,\n  });\n  if (error) return map;\n  for (const row of Array.isArray(data) ? data : []) {\n    const type = String(row?.subject_type || "");\n    const id = String(row?.subject_id || "");\n    const distance = Number(row?.distance_km);\n    if (type && id && Number.isFinite(distance)) map.set(`${type}:${id}`, distance);\n  }\n  return map;\n}\n\nexport function directionsUrl(address: string) {\n  return `https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(address)}&travelmode=driving`;\n}\n''')

          # Homes use server-computed distance, never listing coordinates in the browser.
          replace('src/pages/Search.tsx',
              '''import {\n  distanceBetweenKm,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''',
              '''import {\n  getDiscoveryDistanceMap,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''')
          replace('src/pages/Search.tsx',
              '''  } = useDiscoveryLocation();\n\n  useEffect(() => {\n    const saved = sessionStorage.getItem("search_property_type");''',
              '''  } = useDiscoveryLocation();\n  const [distanceMap, setDistanceMap] = useState<Map<string, number>>(new Map());\n\n  useEffect(() => {\n    let live = true;\n    void getDiscoveryDistanceMap(location).then((next) => { if (live) setDistanceMap(next); });\n    return () => { live = false; };\n  }, [location]);\n\n  useEffect(() => {\n    const saved = sessionStorage.getItem("search_property_type");''')
          replace('src/pages/Search.tsx',
              '''        .map((listing) => {\n          const lat = Number(listing.gps_latitude);\n          const lng = Number(listing.gps_longitude);\n          const distance =\n            location && Number.isFinite(lat) && Number.isFinite(lng)\n              ? distanceBetweenKm(location, { lat, lng })\n              : null;\n          return { listing, distance };\n        })''',
              '''        .map((listing) => ({\n          listing,\n          distance: distanceMap.get(`listing:${listing.id}`) ?? null,\n        }))''')
          replace('src/pages/Search.tsx', '      location,\n    ],', '      distanceMap,\n    ],')

          # Hotels use the same server distance projection.
          replace('src/pages/HotelsHome.tsx',
              '''import {\n  distanceBetweenKm,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''',
              '''import {\n  getDiscoveryDistanceMap,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''')
          replace('src/pages/HotelsHome.tsx',
              '''function coordinates(hotel: HotelRow) {\n  const lat = Number(hotel.gps_latitude);\n  const lng = Number(hotel.gps_longitude);\n  return Number.isFinite(lat) && Number.isFinite(lng) ? { lat, lng } : null;\n}\n\n''', '')
          replace('src/pages/HotelsHome.tsx',
              '''  } = useDiscoveryLocation();\n\n  useEffect(() => {''',
              '''  } = useDiscoveryLocation();\n  const [distanceMap, setDistanceMap] = useState<Map<string, number>>(new Map());\n\n  useEffect(() => {\n    let live = true;\n    void getDiscoveryDistanceMap(userLocation).then((next) => { if (live) setDistanceMap(next); });\n    return () => { live = false; };\n  }, [userLocation]);\n\n  useEffect(() => {''')
          replace('src/pages/HotelsHome.tsx',
              '''        .map((hotel) => {\n          const point = coordinates(hotel);\n          return {\n            hotel,\n            distance:\n              userLocation && point\n                ? distanceBetweenKm(userLocation, point)\n                : null,\n          };\n        })''',
              '''        .map((hotel) => ({\n          hotel,\n          distance: distanceMap.get(`hotel:${hotel.hotel_id}`) ?? null,\n        }))''')
          replace('src/pages/HotelsHome.tsx',
              '    [hotels, query, state, city, amenities, minPrice, maxPrice, userLocation, radius],',
              '    [hotels, query, state, city, amenities, minPrice, maxPrice, distanceMap, radius],')

          # Apartment detail: address is public; road directions use address; distance comes from server.
          replace('src/pages/ListingDetailCore.tsx',
              '''import {\n  directionsUrl,\n  distanceBetweenKm,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''',
              '''import {\n  directionsUrl,\n  getDiscoveryDistanceMap,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''')
          replace('src/pages/ListingDetailCore.tsx',
              '  const { location } = useDiscoveryLocation();\n  const { getNumber } = usePlatformSettings();',
              '  const { location } = useDiscoveryLocation();\n  const [distance, setDistance] = useState<number | null>(null);\n  const { getNumber } = usePlatformSettings();')
          replace('src/pages/ListingDetailCore.tsx',
              '''  useEffect(() => {\n    void load();\n  }, [listingId, profile.user_id]);\n\n  function support(''',
              '''  useEffect(() => {\n    void load();\n  }, [listingId, profile.user_id]);\n\n  useEffect(() => {\n    let live = true;\n    void getDiscoveryDistanceMap(location).then((map) => {\n      if (live) setDistance(map.get(`listing:${listing?.id || listingId}`) ?? null);\n    });\n    return () => { live = false; };\n  }, [listing?.id, listingId, location]);\n\n  function support(''')
          replace('src/pages/ListingDetailCore.tsx',
              '''  const accommodationPaid = reservation\n    ? hasProtectedAccommodationPayment(reservation)\n    : false;\n  const locationExact = accommodationPaid && listing.location_exact === true;\n  const visibleAddress = locationExact\n    ? locationLabel(listing.address, listing.city, listing.state)\n    : locationLabel(listing.city, listing.state);\n  const mapPoint = Number.isFinite(Number(listing.gps_latitude)) &&\n    Number.isFinite(Number(listing.gps_longitude))\n      ? {\n          lat: Number(listing.gps_latitude),\n          lng: Number(listing.gps_longitude),\n        }\n      : null;\n  const destination = locationExact ? mapPoint : null;\n  const distance =\n    location && mapPoint ? distanceBetweenKm(location, mapPoint) : null;''',
              '''  const accommodationPaid = reservation\n    ? hasProtectedAccommodationPayment(reservation)\n    : false;\n  void accommodationPaid;\n  const visibleAddress = locationLabel(listing.address, listing.city, listing.state);''')
          replace('src/pages/ListingDetailCore.tsx',
              '''                    {!locationExact && (\n                      <p className="mt-1 text-[9px] text-[#5F6575]">\n                        Approximate area and distance only. The exact address,\n                        entrance and road directions unlock after the full\n                        accommodation payment is confirmed and protected.\n                      </p>\n                    )}\n                  </div>\n                  {destination && (\n                    <a\n                      href={directionsUrl(destination.lat, destination.lng)}''',
              '''                    <p className="mt-1 text-[9px] text-[#5F6575]">\n                      The published street address is visible before booking. Internal entrance-location data stays private.\n                    </p>\n                  </div>\n                  {visibleAddress && (\n                    <a\n                      href={directionsUrl(visibleAddress)}''')

          # Hotel detail: same public-address/private-coordinate contract.
          replace('src/pages/HotelDetailExperience.tsx',
              '''  getHotelBookingsForUser,\n  getHotelById,''',
              '''  getHotelById,''')
          replace('src/pages/HotelDetailExperience.tsx',
              '''import {\n  directionsUrl,\n  distanceBetweenKm,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''',
              '''import {\n  directionsUrl,\n  getDiscoveryDistanceMap,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''')
          replace('src/pages/HotelDetailExperience.tsx',
              '  const [submittingReview, setSubmittingReview] = useState(false);\n  const [locationUnlocked, setLocationUnlocked] = useState(false);',
              '  const [submittingReview, setSubmittingReview] = useState(false);\n  const [distance, setDistance] = useState<number | null>(null);')
          replace('src/pages/HotelDetailExperience.tsx',
              '''      const [hotelResult, reviewResult, eligibility, bookingResult, savedResult] =\n        await Promise.all([\n          getHotelById(hotelId),\n          getHotelReviews(hotelId),\n          canReviewHotel(hotelId, profile.user_id),\n          getHotelBookingsForUser(profile.user_id),\n          getMySavedHotelIds(),\n        ]);''',
              '''      const [hotelResult, reviewResult, eligibility, savedResult] =\n        await Promise.all([\n          getHotelById(hotelId),\n          getHotelReviews(hotelId),\n          canReviewHotel(hotelId, profile.user_id),\n          getMySavedHotelIds(),\n        ]);''')
          old='''      setLocationUnlocked(\n        Boolean(\n          bookingResult.bookings?.some(\n            (booking) =>\n              Number(booking.hotel_id) === Number(hotelId) &&\n              booking.payment_status === "paid" &&\n              Boolean(booking.payment_protection_id) &&\n              ["confirmed", "checked_in"].includes(String(booking.status)),\n          ),\n        ),\n      );\n'''
          replace('src/pages/HotelDetailExperience.tsx', old, '')
          replace('src/pages/HotelDetailExperience.tsx',
              '''  }, [hotelId, profile.user_id]);\n\n  const tomorrow = useMemo(() => {''',
              '''  }, [hotelId, profile.user_id]);\n\n  useEffect(() => {\n    let live = true;\n    void getDiscoveryDistanceMap(location).then((map) => {\n      if (live) setDistance(map.get(`hotel:${hotelId}`) ?? null);\n    });\n    return () => { live = false; };\n  }, [hotelId, location]);\n\n  const tomorrow = useMemo(() => {''')
          replace('src/pages/HotelDetailExperience.tsx',
              '''  const latitude = Number(hotel.gps_latitude);\n  const longitude = Number(hotel.gps_longitude);\n  const point =\n    Number.isFinite(latitude) && Number.isFinite(longitude)\n      ? { lat: latitude, lng: longitude }\n      : null;\n  const exactDestination =\n    locationUnlocked && hotel.location_exact === true ? point : null;\n  const distance =\n    location && point ? distanceBetweenKm(location, point) : null;\n''', '')
          replace('src/pages/HotelDetailExperience.tsx',
              '{locationLabel(hotel.area, hotel.city, hotel.state)}',
              '{locationLabel(hotel.address, hotel.area, hotel.city, hotel.state)}')
          replace('src/pages/HotelDetailExperience.tsx',
              '''          {exactDestination && hotel.address ? (\n            <div className="mt-3 flex items-center justify-between gap-3">\n              <p className="text-[10px] text-[#858B9A]">\n                {locationLabel(hotel.address, hotel.area, hotel.city, hotel.state)}\n              </p>\n              <a\n                href={directionsUrl(exactDestination.lat, exactDestination.lng)}\n                target="_blank"\n                rel="noreferrer"\n                className="shrink-0 text-[9px] font-semibold text-violet-300"\n              >\n                Road directions\n              </a>\n            </div>\n          ) : (\n            <p className="mt-2 text-[10px] leading-5 text-[#777E8E]">\n              Approximate area only. Exact entrance and road directions unlock for a confirmed paid stay.\n            </p>\n          )}''',
              '''          <div className="mt-3 flex items-center justify-between gap-3">\n            <div>\n              <p className="text-[10px] text-[#858B9A]">\n                {locationLabel(hotel.address, hotel.area, hotel.city, hotel.state)}\n              </p>\n              <p className="mt-1 text-[8px] text-[#666D7E]">The published street address is visible before booking; internal entrance-location data stays private.</p>\n            </div>\n            {hotel.address ? (\n              <a\n                href={directionsUrl(locationLabel(hotel.address, hotel.area, hotel.city, hotel.state))}\n                target="_blank"\n                rel="noreferrer"\n                className="shrink-0 text-[9px] font-semibold text-violet-300"\n              >\n                Road directions\n              </a>\n            ) : null}\n          </div>''')

          # Discovery cards surface the published address rather than hiding it behind city/state.
          replace('src/components/ListingCard.tsx',
              '''<p className="mt-1 truncate text-[10px] text-[#686F80]">{[listing.city, listing.state].filter(Boolean).join(', ') || 'Location unavailable'}</p>''',
              '''<p className="mt-1 truncate text-[10px] text-[#686F80]">{[listing.address, listing.city, listing.state].filter(Boolean).join(', ') || 'Location unavailable'}</p>''')

          # User-facing copy must not expose coordinate/pin jargon.
          for path in ['src/components/PreciseLocationPicker.tsx','src/components/LocationMap.tsx']:
              p=Path(path); s=p.read_text()
              s=s.replace('coordinates stay private to WeHouse operations','entrance-location data stays private to WeHouse operations')
              s=s.replace('exact coordinates are not shown','the exact entrance location is not shown')
              p.write_text(s)

      - name: Remove one-use workflow
        run: rm .github/workflows/temporary-routing-location-fix.yml
      - name: Commit bounded repair
        run: |
          git config user.name "forttunes2-droid"
          git config user.email "forttunes2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete Message WeHouse routing and location privacy"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
