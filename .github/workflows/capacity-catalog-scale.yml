name: Capacity catalog scale (dedicated disposable runner)
on:
  workflow_dispatch:
    inputs:
      catalog:
        description: Synthetic catalog size on an isolated runner with 100 GB free
        type: choice
        required: true
        default: million
        options:
          - million
          - full
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/capacity-catalog-scale.yml'
      - 'scripts/seed-capacity-scale.sh'
      - 'scripts/load-catalog-scale.mjs'
      - 'supabase/migrations/**'

permissions:
  contents: read

jobs:
  exact-catalog-cardinality:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'fix/next-structural-work-20261007'
    # Deliberately never scheduled on the 14 GB standard runner or on hosted Supabase.
    runs-on: [self-hosted, linux, x64, wehouse-capacity]
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Require disposable runner and 100 GB free
        run: |
          test "${{ runner.environment }}" = self-hosted
          test "$(df -BG --output=avail / | tail -1 | tr -dc '0-9')" -ge 100
      - name: Start disposable local Supabase and replay migrations
        run: |
          npx --yes supabase@2.114.0 start
          npx --yes supabase@2.114.0 db reset --local
      - name: Seed exact synthetic catalog and profile counts
        run: WEHOUSE_CAPACITY_PRESET=${{ inputs.catalog || (github.event_name == 'pull_request' && 'large' || 'million') }} bash scripts/seed-capacity-scale.sh
      - name: Measure public read paths
        run: WEHOUSE_CAPACITY_PRESET=${{ inputs.catalog || (github.event_name == 'pull_request' && 'large' || 'million') }} node scripts/load-catalog-scale.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-catalog-scale-results
          path: test-results/catalog-scale.json
          retention-days: 14
      - name: Destroy disposable services
        if: always()
        run: npx --yes supabase@2.114.0 stop --no-backup
