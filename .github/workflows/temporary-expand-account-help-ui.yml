name: Temporary Expand Account Help UI
on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Expand Account Help records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/components/AccountHelpCenter.tsx')
          s=p.read_text()
          s=s.replace('''type HelpTargets = {\n  account?: HelpTarget;\n  worker_jobs?: HelpTarget[];''','''type HelpTargets = {\n  account?: HelpTarget;\n  worker_profile?: HelpTarget | null;\n  worker_jobs?: HelpTarget[];''')
          s=s.replace('''  hotel_bookings?: HelpTarget[];\n  properties?: HelpTarget[];\n  hotels?: HelpTarget[];''','''  hotel_bookings?: HelpTarget[];\n  property_requests?: HelpTarget[];\n  properties?: HelpTarget[];\n  hotels?: HelpTarget[];\n  partner_reservations?: HelpTarget[];\n  partner_hotel_bookings?: HelpTarget[];''')
          s=s.replace('''      ...(targets.hotel_bookings || []),\n      ...(targets.properties || []),\n      ...(targets.hotels || []),''','''      ...(targets.hotel_bookings || []),\n      ...(targets.property_requests || []),\n      ...(targets.properties || []),\n      ...(targets.hotels || []),\n      ...(targets.partner_reservations || []),\n      ...(targets.partner_hotel_bookings || []),''')
          s=s.replace('''  const jobTargets = targets.worker_jobs || [];''','''  const jobTargets = [\n    ...(targets.worker_profile ? [targets.worker_profile] : []),\n    ...(targets.worker_jobs || []),\n  ];''')
          s=s.replace('''      ...(targets.hotel_bookings || []),\n    ],\n    [targets],\n  );\n  const payoutTargets''','''      ...(targets.hotel_bookings || []),\n      ...(targets.partner_reservations || []),\n      ...(targets.partner_hotel_bookings || []),\n    ],\n    [targets],\n  );\n  const payoutTargets''')
          # Replace service start handler so a worker profile/review uses Worker Operations too.
          old='''  function startJob() {\n    const target = jobTargets.find((item) => key(item) === targetId);\n    if (!target) return toast.error("Choose the job first");\n    openConversation({\n      subject: target.label,\n      category: "service_booking_help",\n      contextType: "worker_booking",\n      contextId: target.subject_id,\n      contextSnapshot: {\n        source_type: "worker_booking",\n        source_id: target.subject_id,\n        service_type: target.label,\n        status: target.detail,\n      },\n    });\n  }'''
          new='''  function startJob() {\n    const target = jobTargets.find((item) => key(item) === targetId);\n    if (!target) return toast.error("Choose the Service Provider record first");\n    if (target.subject_type === "worker") {\n      openConversation({\n        subject: target.label,\n        category: "worker_verification",\n        contextType: "contextual_help",\n        contextId: target.subject_id,\n        contextSnapshot: {\n          reason_code: "worker_verification",\n          subject_type: "worker",\n          source_type: "worker",\n          source_id: target.subject_id,\n          linked_label: target.label,\n        },\n      });\n      return;\n    }\n    openConversation({\n      subject: target.label,\n      category: "service_booking_help",\n      contextType: "worker_booking",\n      contextId: target.subject_id,\n      contextSnapshot: {\n        source_type: "worker_booking",\n        source_id: target.subject_id,\n        service_type: target.label,\n        status: target.detail,\n      },\n    });\n  }'''
          if old not in s:
              raise SystemExit('startJob anchor not found')
          s=s.replace(old,new)
          s=s.replace('''              title="Which service job?"''','''              title="Which Service Provider record?"''')
          s=s.replace('''              empty="No WeHouse Services job is linked to this identity yet."''','''              empty="No Service Provider profile or job is linked to this identity yet."''')
          p.write_text(s)

          p=Path('tests/account-help-and-arrival-window.test.mjs')
          s=p.read_text()
          s=s.replace('''  assert.match(help, /Safety or account security/);''','''  assert.match(help, /Safety or account security/);\n  assert.match(help, /worker_profile/);\n  assert.match(help, /property_requests/);\n  assert.match(help, /partner_reservations/);\n  assert.match(help, /partner_hotel_bookings/);''')
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/temporary-expand-account-help-ui.yml
          git config user.name "WeHouse Account Help Coverage Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/AccountHelpCenter.tsx tests/account-help-and-arrival-window.test.mjs .github/workflows/temporary-expand-account-help-ui.yml
          git commit -m "Cover Worker and Partner records in Account Help" || exit 0
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
