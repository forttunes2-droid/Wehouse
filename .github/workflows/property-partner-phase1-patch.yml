name: Property Partner Phase 1 Patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/property-partner-phase1-patch.yml'

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch Property Partner dashboard
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          dashboard = Path('src/pages/PropertyOwnerDashboard.tsx')
          text = dashboard.read_text()

          import_anchor = "import PartnerSupportChat from '@/components/PartnerSupportChat';\n"
          import_line = "import PropertyInspectionRequestPanel from '@/components/PropertyInspectionRequestPanel';\n"
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('Import anchor not found')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          overview_anchor = '  return (\n    <div className="space-y-6">\n      {/* Stat Cards Grid */}'
          overview_replacement = '  return (\n    <div className="space-y-6">\n      <PropertyInspectionRequestPanel profile={profile} />\n\n      {/* Stat Cards Grid */}'
          if '<PropertyInspectionRequestPanel profile={profile} />' not in text:
              if overview_anchor not in text:
                  raise SystemExit('Overview anchor not found')
              text = text.replace(overview_anchor, overview_replacement, 1)

          dashboard.write_text(text)

          component = Path('src/components/PropertyInspectionRequestPanel.tsx')
          component.write_text(r'''import { useEffect, useState } from 'react';
import { toast } from 'sonner';
import { supabase } from '@/lib/supabase';
import type { Profile } from '@/types';

type RequestRow = {
  id: string;
  request_code: string;
  property_address: string;
  property_city: string;
  property_state: string;
  property_type: string | null;
  status: string | null;
  rejection_reason: string | null;
  scheduled_date: string | null;
  created_at: string | null;
};

const EMPTY_FORM = {
  propertyAddress: '',
  propertyCity: '',
  propertyState: '',
  propertyType: 'apartment',
  bedrooms: '1',
  bathrooms: '1',
  expectedRent: '',
  description: '',
  ownerPhone: '',
};

export default function PropertyInspectionRequestPanel({ profile }: { profile: Profile }) {
  const [expanded, setExpanded] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [loading, setLoading] = useState(true);
  const [requests, setRequests] = useState<RequestRow[]>([]);
  const [form, setForm] = useState({
    ...EMPTY_FORM,
    propertyCity: profile.city || profile.local_government || '',
    propertyState: profile.state || '',
    ownerPhone: profile.phone || '',
  });

  useEffect(() => {
    void loadRequests();
  }, [profile.user_id]);

  async function loadRequests() {
    setLoading(true);
    const { data, error } = await supabase
      .from('inspection_requests')
      .select('id, request_code, property_address, property_city, property_state, property_type, status, rejection_reason, scheduled_date, created_at')
      .eq('owner_id', profile.user_id)
      .order('created_at', { ascending: false });

    if (error) {
      console.error('[PropertyInspectionRequestPanel] load failed', error);
      toast.error('Unable to load your property requests');
    }

    setRequests((data || []) as RequestRow[]);
    setLoading(false);
  }

  async function submitRequest(event: React.FormEvent) {
    event.preventDefault();

    if (!form.propertyAddress.trim()) {
      toast.error('Property address is required');
      return;
    }
    if (!form.propertyState.trim()) {
      toast.error('State is required');
      return;
    }
    if (!form.propertyCity.trim()) {
      toast.error('Local government/city is required');
      return;
    }

    setSubmitting(true);
    const { error } = await supabase.rpc('create_my_property_inspection_request', {
      p_property_address: form.propertyAddress.trim(),
      p_property_city: form.propertyCity.trim(),
      p_property_state: form.propertyState.trim(),
      p_property_type: form.propertyType,
      p_bedrooms: form.propertyType === 'hotel' ? null : Number(form.bedrooms || 0),
      p_bathrooms: form.propertyType === 'hotel' ? null : Number(form.bathrooms || 0),
      p_expected_rent: form.expectedRent ? Number(form.expectedRent) : null,
      p_description: form.description.trim() || null,
      p_owner_phone: form.ownerPhone.trim() || null,
      p_photo_urls: [],
    });
    setSubmitting(false);

    if (error) {
      toast.error(error.message || 'Unable to submit property request');
      return;
    }

    toast.success('Property request sent to WeHouse');
    setForm({
      ...EMPTY_FORM,
      propertyCity: profile.city || profile.local_government || '',
      propertyState: profile.state || '',
      ownerPhone: profile.phone || '',
    });
    setExpanded(false);
    await loadRequests();
  }

  const statusClass = (status: string | null) => {
    switch (status) {
      case 'approved':
      case 'completed':
        return 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20';
      case 'rejected':
        return 'bg-red-500/10 text-red-400 border-red-500/20';
      case 'scheduled':
      case 'in_progress':
        return 'bg-blue-500/10 text-blue-400 border-blue-500/20';
      default:
        return 'bg-amber-500/10 text-amber-400 border-amber-500/20';
    }
  };

  return (
    <section className="rounded-2xl bg-[#12121A]/60 border border-violet-500/15 overflow-hidden">
      <div className="p-4 lg:p-5 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <p className="text-sm font-semibold text-white">Request a Property Listing</p>
          <p className="text-[11px] text-[#8A8B9C] mt-1 max-w-xl">
            Send the property details to WeHouse. WeHouse will review and inspect it before creating or publishing any listing.
          </p>
        </div>
        <button
          type="button"
          onClick={() => setExpanded(value => !value)}
          className="h-10 px-4 rounded-xl bg-gradient-to-r from-violet-500 to-violet-700 text-white text-xs font-semibold whitespace-nowrap"
        >
          {expanded ? 'Close Form' : 'Submit Property'}
        </button>
      </div>

      {expanded && (
        <form onSubmit={submitRequest} className="border-t border-white/[0.05] p-4 lg:p-5 space-y-4">
          <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
            <label className="space-y-1 md:col-span-2">
              <span className="text-[10px] text-[#8A8B9C]">Property address *</span>
              <input
                value={form.propertyAddress}
                onChange={event => setForm(current => ({ ...current, propertyAddress: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                placeholder="Full property address"
              />
            </label>

            <label className="space-y-1">
              <span className="text-[10px] text-[#8A8B9C]">State *</span>
              <input
                value={form.propertyState}
                onChange={event => setForm(current => ({ ...current, propertyState: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                placeholder="State"
              />
            </label>

            <label className="space-y-1">
              <span className="text-[10px] text-[#8A8B9C]">Local government/city *</span>
              <input
                value={form.propertyCity}
                onChange={event => setForm(current => ({ ...current, propertyCity: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                placeholder="LGA or city"
              />
            </label>

            <label className="space-y-1">
              <span className="text-[10px] text-[#8A8B9C]">Property group *</span>
              <select
                value={form.propertyType}
                onChange={event => setForm(current => ({ ...current, propertyType: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
              >
                <option value="apartment">Apartment</option>
                <option value="hotel">Hotel</option>
              </select>
            </label>

            <label className="space-y-1">
              <span className="text-[10px] text-[#8A8B9C]">Phone for inspection</span>
              <input
                value={form.ownerPhone}
                onChange={event => setForm(current => ({ ...current, ownerPhone: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                placeholder="Phone number"
              />
            </label>

            {form.propertyType === 'apartment' && (
              <>
                <label className="space-y-1">
                  <span className="text-[10px] text-[#8A8B9C]">Bedrooms</span>
                  <input
                    type="number"
                    min="0"
                    value={form.bedrooms}
                    onChange={event => setForm(current => ({ ...current, bedrooms: event.target.value }))}
                    className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                  />
                </label>
                <label className="space-y-1">
                  <span className="text-[10px] text-[#8A8B9C]">Bathrooms</span>
                  <input
                    type="number"
                    min="0"
                    value={form.bathrooms}
                    onChange={event => setForm(current => ({ ...current, bathrooms: event.target.value }))}
                    className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                  />
                </label>
              </>
            )}

            <label className="space-y-1">
              <span className="text-[10px] text-[#8A8B9C]">Expected rent/rate</span>
              <input
                type="number"
                min="0"
                value={form.expectedRent}
                onChange={event => setForm(current => ({ ...current, expectedRent: event.target.value }))}
                className="w-full h-10 rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 outline-none focus:border-violet-500"
                placeholder="Optional"
              />
            </label>

            <label className="space-y-1 md:col-span-2">
              <span className="text-[10px] text-[#8A8B9C]">Property details</span>
              <textarea
                rows={4}
                value={form.description}
                onChange={event => setForm(current => ({ ...current, description: event.target.value }))}
                className="w-full rounded-xl bg-[#1A1A24] border border-[#2A2A3A] text-white text-sm px-3 py-2 outline-none focus:border-violet-500 resize-none"
                placeholder="Apartment type, short let/long stay, hotel information, landmarks and any other details for WeHouse"
              />
            </label>
          </div>

          <button
            type="submit"
            disabled={submitting}
            className="w-full h-11 rounded-xl bg-gradient-to-r from-violet-500 to-violet-700 text-white text-sm font-semibold disabled:opacity-40"
          >
            {submitting ? 'Submitting...' : 'Send Request to WeHouse'}
          </button>
        </form>
      )}

      <div className="border-t border-white/[0.05] p-4 lg:p-5">
        <div className="flex items-center justify-between mb-3">
          <p className="text-xs font-semibold text-white">My Property Requests</p>
          <button type="button" onClick={() => void loadRequests()} className="text-[10px] text-violet-400 hover:text-violet-300">Refresh</button>
        </div>

        {loading ? (
          <p className="text-[11px] text-[#5C5E72]">Loading requests...</p>
        ) : requests.length === 0 ? (
          <p className="text-[11px] text-[#5C5E72]">No property requests submitted yet.</p>
        ) : (
          <div className="space-y-2">
            {requests.slice(0, 5).map(request => (
              <div key={request.id} className="rounded-xl bg-[#1A1A24] border border-[#2A2A3A] p-3">
                <div className="flex items-start justify-between gap-3">
                  <div className="min-w-0">
                    <p className="text-xs text-white font-medium truncate">{request.property_address}</p>
                    <p className="text-[9px] text-[#5C5E72] mt-0.5">
                      {request.request_code} · {request.property_type || 'property'} · {request.property_city}, {request.property_state}
                    </p>
                  </div>
                  <span className={`flex-shrink-0 text-[8px] px-2 py-1 rounded-full border capitalize ${statusClass(request.status)}`}>
                    {request.status || 'pending'}
                  </span>
                </div>
                {request.scheduled_date && <p className="text-[9px] text-blue-400 mt-2">Inspection date: {new Date(request.scheduled_date).toLocaleDateString()}</p>}
                {request.rejection_reason && <p className="text-[9px] text-red-400 mt-2">Reason: {request.rejection_reason}</p>}
              </div>
            ))}
          </div>
        )}
      </div>
    </section>
  );
}
''')

          Path('.github/workflows/property-partner-phase1-patch.yml').unlink()
          PY

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build

      - name: Commit validated patch
        shell: bash
        run: |
          git config user.name "WeHouse Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/PropertyOwnerDashboard.tsx src/components/PropertyInspectionRequestPanel.tsx .github/workflows/property-partner-phase1-patch.yml
          git commit -m "feat(property-partner): add secure property request UI"
          git push origin main
