name: Profile refinement source
on:
  push:
    branches: [codex/profile-help-refinement-20260924]
    paths: [.github/workflows/profile-refinement-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: |
          mkdir -p /tmp/profile-refinement
          git archive --format=tar HEAD | gzip > /tmp/profile-refinement/source.tar.gz
          git rev-parse HEAD > /tmp/profile-refinement/commit.txt
          npm ci --ignore-scripts --no-audit --no-fund
          tar -czf /tmp/profile-refinement/dependencies.tar.gz node_modules
          cd /tmp/profile-refinement
          sha256sum source.tar.gz dependencies.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: profile-refinement-source
          path: /tmp/profile-refinement/
          retention-days: 1
