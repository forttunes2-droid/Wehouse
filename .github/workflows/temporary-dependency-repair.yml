name: Temporary Dependency Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair-lockfile:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Use Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Apply supported audit fixes to lockfile
        run: npm audit fix --package-lock-only

      - name: Verify high severity advisories are gone
        run: npm audit --audit-level=high

      - name: Commit repaired lockfile when changed
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json package.json; then
            echo "Lockfile is already repaired."
            exit 0
          fi
          git config user.name "WeHouse Security Repair"
          git config user.email "actions@users.noreply.github.com"
          git add package-lock.json package.json
          git commit -m "Repair audited dependency lockfile"
          git push origin HEAD:${{ github.head_ref }}
