name: Commit reviewed property naming follow-up
on:
  push:
    branches: [codex/property-workspace-routing-20260922]
    paths: [.property-repair/followup.patch]
permissions:
  contents: write
concurrency:
  group: reviewed-property-repair-assembly
  cancel-in-progress: false
jobs:
  assemble:
    if: github.repository == 'forttunes2-droid/Wehouse' && github.ref == 'refs/heads/codex/property-workspace-routing-20260922'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Verify and commit reviewed follow-up
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, pathlib, subprocess
          patch = pathlib.Path('.property-repair/followup.patch').read_bytes()
          assert hashlib.sha256(patch).hexdigest() == '1942db2b555567f30eedbb557b7906d090c20d7b7387f55371fc9251f3af14cc'
          allowed = {'src/components/PartnerSubmittedRequests.tsx','src/components/PropertyPipelineWorkspace.tsx','src/lib/propertyNavigation.ts','tests/property-workspace-routing.test.mjs'}
          paths = {line.split(b' b/',1)[1].decode() for line in patch.splitlines() if line.startswith(b'diff --git ')}
          assert paths == allowed
          subprocess.run(['git','apply','--check','-'],input=patch,check=True)
          subprocess.run(['git','apply','-'],input=patch,check=True)
          PY
          git rm -r .property-repair
          git add src tests
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Keep one property name across All Live messages and internal review'
          REMOTE_SHA=$(git ls-remote origin refs/heads/codex/property-workspace-routing-20260922 | cut -f1)
          test "$REMOTE_SHA" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/codex/property-workspace-routing-20260922
