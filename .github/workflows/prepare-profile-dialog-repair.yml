name: Prepare single-owner property dialog repair
on:
  push:
    branches: [codex/property-workspace-routing-20260922]
    paths: [.github/workflows/prepare-profile-dialog-repair.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Verify six exact source changes and prepare tree without changing a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,lzma,os,pathlib,subprocess,urllib.request
          payload=''
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          base='f0ef6cc3b7f1c8b4b36e6c96e7f09c085e625488'
          assert git('rev-parse','HEAD^')==base, 'Branch moved; reconcile changes first'
          raw=lzma.decompress(base64.b64decode(payload,validate=True))
          assert hashlib.sha256(raw).hexdigest()=='5100bcdc3533a36e5e1ced2124f1904c6b027669e13c68ff1c80855a40a4bf48'
          delta=json.loads(raw)
          assert delta['base']==base and len(delta['files'])==6
          assert delta['expected_tree']=='03e0dfc2526d56859ecd60986cd70fb8f17f144f'
          entries=[]; seen=set()
          for row in delta['files']:
              name=row['path']; path=pathlib.Path(name)
              assert name not in seen and name.startswith(('src/','tests/browser/')) and not path.is_absolute() and '..' not in path.parts
              assert not path.is_symlink() and all(not p.is_symlink() for p in path.parents)
              seen.add(name)
              if row['old'] is None:
                  assert not path.exists(); old=b''
              else:
                  old=path.read_bytes(); assert hashlib.sha256(old).hexdigest()==row['old'], name
              lines=old.decode().splitlines(keepends=True); limit=len(lines)
              for start,end,text in reversed(row['edits']):
                  assert 0<=start<=end<=limit
                  lines[start:end]=text.splitlines(keepends=True); limit=start
              new=''.join(lines)
              assert hashlib.sha256(new.encode()).hexdigest()==row['new'], name
              entries.append({'path':name,'type':'blob','mode':'100644','content':new})
          repo=os.environ['GITHUB_REPOSITORY']; assert repo=='forttunes2-droid/Wehouse'
          def api(method,path,body=None):
              req=urllib.request.Request('https://api.github.com/repos/'+repo+path,data=None if body is None else json.dumps(body).encode(),method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'})
              with urllib.request.urlopen(req,timeout=90) as response: return json.load(response)
          assert api('GET','/git/ref/heads/codex/property-workspace-routing-20260922')['object']['sha']==os.environ['GITHUB_SHA']
          # Base is the reviewed parent: no workflow file is edited by this token.
          tree=api('POST','/git/trees',{'base_tree':git('rev-parse','HEAD^:'),'tree':entries})
          assert tree['sha']==delta['expected_tree'], 'Final source differs from local tested source'
          result={'tree':tree['sha'],'parent':os.environ['GITHUB_SHA'],'base':base,'files':list(seen),'branch_updated':False,'production_changed':False}
          pathlib.Path(os.environ['RUNNER_TEMP'],'property-dialog-tree.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: verified-property-dialog-tree
          path: ${{ runner.temp }}/property-dialog-tree.json
          retention-days: 1
