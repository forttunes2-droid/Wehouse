name: Property repair source snapshot
on:
  push:
    branches: [codex/property-workspace-routing-20260922]
    paths: [.github/workflows/property-repair-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive tracked source only
        run: git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/wehouse-property-source.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: wehouse-property-source
          path: ${{ runner.temp }}/wehouse-property-source.tar.gz
          retention-days: 1
