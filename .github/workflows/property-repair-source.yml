name: Property repair source snapshot
on:
  push:
    branches: [codex/property-workspace-routing-20260922]
    paths: [.github/workflows/property-repair-source.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Archive tracked source and isolated test dependencies
        run: |
          git archive --format=tar HEAD | gzip > "$RUNNER_TEMP/wehouse-property-source.tar.gz"
          tar -czf "$RUNNER_TEMP/wehouse-property-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: wehouse-property-source
          path: |
            ${{ runner.temp }}/wehouse-property-source.tar.gz
            ${{ runner.temp }}/wehouse-property-dependencies.tar.gz
          retention-days: 1
