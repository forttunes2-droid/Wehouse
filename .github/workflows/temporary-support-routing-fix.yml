name: Temporary Support Routing Fix
on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Repair purpose-aware support presentation
        shell: python
        run: |
          from pathlib import Path

          support = Path('src/lib/supabase/support.ts')
          text = support.read_text()
          old = '''  if (contextType === "worker_booking")\n    return {\n      kind: "service_help",\n      title: rawSubject || String(snapshot.service_type || "Service booking"),\n      operator: "WeHouse Service Support",\n      meta: ["Service booking", audience === "customer" ? "" : reference, status]\n        .filter(Boolean)\n        .join(" · "),\n      operational: true,\n    };\n'''
          new = '''  if (contextType === "worker_booking")\n    return {\n      kind: "service_help",\n      title: rawSubject || String(snapshot.service_type || "Service booking"),\n      operator: "WeHouse Support",\n      meta: ["Service booking", audience === "customer" ? "" : reference, status]\n        .filter(Boolean)\n        .join(" · "),\n      operational: false,\n    };\n  if (contextType === "hotel_booking_help")\n    return {\n      kind: "support",\n      title:\n        rawSubject ||\n        String(snapshot.hotel_name || "Hotel booking help"),\n      operator: "WeHouse Support",\n      meta: ["Hotel booking", audience === "customer" ? "" : reference, status]\n        .filter(Boolean)\n        .join(" · "),\n      operational: false,\n    };\n'''
          if old not in text:
              raise SystemExit('worker_booking presentation block not found')
          support.write_text(text.replace(old, new, 1))

          reservations = Path('src/pages/MyReservations.tsx')
          text = reservations.read_text()
          marker = 'function hotelSupport(row: any) {'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('hotelSupport not found')
          end = text.find('\n  if (activeService)', start)
          if end < 0:
              raise SystemExit('hotelSupport end not found')
          block = text[start:end]
          block = block.replace('category: "hotel_booking",', 'category: "hotel_booking_help",', 1)
          block = block.replace('contextType: "hotel_booking",', 'contextType: "hotel_booking_help",', 1)
          needle = 'contextSnapshot: {\n            booking_id: row.booking_id,'
          replacement = 'contextSnapshot: {\n            source_type: "hotel_booking_help",\n            source_id: String(row.booking_id),\n            booking_id: row.booking_id,'
          if needle not in block:
              raise SystemExit('hotel support snapshot marker not found')
          block = block.replace(needle, replacement, 1)
          reservations.write_text(text[:start] + block + text[end:])
      - name: Commit routing repair
        run: |
          git config user.name "WeHouse Support Routing"
          git config user.email "actions@users.noreply.github.com"
          git add src/lib/supabase/support.ts src/pages/MyReservations.tsx
          git commit -m "Separate ordinary WeHouse help from operational threads"
          git rm .github/workflows/temporary-support-routing-fix.yml
          git commit -m "Remove completed support routing repair workflow"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914