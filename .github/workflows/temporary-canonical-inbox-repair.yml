name: Temporary Canonical Inbox Repair

on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
    paths:
      - .github/workflows/temporary-canonical-inbox-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
          fetch-depth: 0
      - name: Apply canonical Inbox repair
        run: python scripts/temporary_canonical_inbox_repair.py
      - name: Commit canonical Inbox repair
        run: |
          git config user.name "WeHouse Structural Repair"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Restore canonical Inbox structure"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
