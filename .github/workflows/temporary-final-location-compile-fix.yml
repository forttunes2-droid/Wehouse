name: Temporary final location compile repair
on:
  push:
    branches: [codex/harden-main-resume-repairs-20260914]
    paths: [.github/workflows/temporary-final-location-compile-fix.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Apply final address-only customer repairs
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p=Path(path); s=p.read_text()
              if old not in s:
                  raise SystemExit(f'expected source not found in {path}: {old[:120]!r}')
              p.write_text(s.replace(old,new,count))

          replace('src/components/PropertyInspectionRequestPanel.tsx',
              'current.propertyAddress || current.location.address,',
              'current.propertyAddress || current.location.address || "",')

          # Legacy Hotel detail component still compiles even though the modern
          # experience is the primary export. Keep it consistent with the same
          # public-address/private-coordinate contract.
          p=Path('src/pages/HotelDetailCore.tsx'); s=p.read_text()
          s=s.replace('  getHotelBookingsForUser,\n','')
          s=s.replace('''import {\n  directionsUrl,\n  distanceBetweenKm,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''','''import {\n  directionsUrl,\n  getDiscoveryDistanceMap,\n  useDiscoveryLocation,\n} from "@/hooks/useDiscoveryLocation";''')
          s=s.replace('    [locationUnlocked, setLocationUnlocked] = useState(false),\n','')
          marker='    [submittingReview, setSubmittingReview] = useState(false),\n'
          if marker not in s: raise SystemExit('HotelDetailCore state marker missing')
          s=s.replace(marker, marker+'    [distance, setDistance] = useState<number | null>(null),\n',1)
          old='''    const [{ hotel: h, error }, { reviews: r }, eligibility, bookingResult] =\n      await Promise.all([\n        getHotelById(hotelId),\n        getHotelReviews(hotelId),\n        canReviewHotel(hotelId, profile.user_id),\n        getHotelBookingsForUser(profile.user_id),\n      ]);'''
          new='''    const [{ hotel: h, error }, { reviews: r }, eligibility] =\n      await Promise.all([\n        getHotelById(hotelId),\n        getHotelReviews(hotelId),\n        canReviewHotel(hotelId, profile.user_id),\n      ]);'''
          if old not in s: raise SystemExit('HotelDetailCore load block missing')
          s=s.replace(old,new,1)
          start=s.find('    setLocationUnlocked(\n')
          if start >= 0:
              end=s.find('    setLoading(false);', start)
              if end < 0: raise SystemExit('HotelDetailCore location unlock end missing')
              s=s[:start]+s[end:]
          effect_anchor='''  useEffect(() => {\n    void load();\n  }, [hotelId]);\n'''
          if effect_anchor not in s: raise SystemExit('HotelDetailCore load effect missing')
          s=s.replace(effect_anchor,effect_anchor+'''  useEffect(() => {\n    let live = true;\n    void getDiscoveryDistanceMap(location).then((map) => {\n      if (live) setDistance(map.get(`hotel:${hotelId}`) ?? null);\n    });\n    return () => { live = false; };\n  }, [hotelId, location]);\n''',1)
          oldvars='''  const latitude = Number(hotel.gps_latitude),\n    longitude = Number(hotel.gps_longitude),\n    mapPoint = Number.isFinite(latitude) && Number.isFinite(longitude) ? { lat: latitude, lng: longitude } : null,\n    destination = locationUnlocked && hotel.location_exact === true ? mapPoint : null,\n    distance = location && mapPoint ? distanceBetweenKm(location, mapPoint) : null;'''
          if oldvars not in s: raise SystemExit('HotelDetailCore coordinate block missing')
          s=s.replace(oldvars,'  const hotelAddress = locationLabel(hotel.address, hotel.area, hotel.city, hotel.state);',1)
          s=s.replace('{locationLabel(hotel.area, hotel.city, hotel.state)}','{hotelAddress}',1)
          oldui='''            {destination && hotel.address ? (\n              <div className="mt-4 flex items-center justify-between gap-3 rounded-xl border border-white/[.06] bg-black/10 p-3 text-[10px] text-[#7D8494]">\n                <span>{locationLabel(hotel.address, hotel.city, hotel.state)}</span>\n                {destination && (\n                  <a\n                    href={directionsUrl(destination.lat, destination.lng)}\n                    target="_blank"\n                    rel="noreferrer"\n                    className="shrink-0 font-semibold text-violet-300"\n                  >\n                    Directions\n                  </a>\n                )}\n              </div>\n            ) : (\n              <div className="mt-4 rounded-xl border border-white/[.06] bg-black/10 p-3 text-[10px] text-[#7D8494]">\n                Approximate area only. The exact entrance and road directions\n                unlock after a confirmed payment.\n              </div>\n            )}'''
          newui='''            {hotelAddress ? (\n              <div className="mt-4 flex items-center justify-between gap-3 rounded-xl border border-white/[.06] bg-black/10 p-3 text-[10px] text-[#7D8494]">\n                <div>\n                  <span>{hotelAddress}</span>\n                  <p className="mt-1 text-[8px] text-[#62697A]">Published street address · internal entrance-location data stays private</p>\n                </div>\n                <a\n                  href={directionsUrl(hotelAddress)}\n                  target="_blank"\n                  rel="noreferrer"\n                  className="shrink-0 font-semibold text-violet-300"\n                >\n                  Directions\n                </a>\n              </div>\n            ) : null}'''
          if oldui not in s: raise SystemExit('HotelDetailCore location UI block missing')
          s=s.replace(oldui,newui,1)
          p.write_text(s)

          # My Bookings Hotel detail also uses the written address only.
          p=Path('src/pages/MyReservations.tsx'); s=p.read_text()
          old='''  const hotelAddress = row.hotels?.address || null;\n  const hotelLatitude = Number(row.hotels?.gps_latitude);\n  const hotelLongitude = Number(row.hotels?.gps_longitude);\n  const exactDestination =\n    row.hotels?.location_exact === true &&\n    Number.isFinite(hotelLatitude) &&\n    Number.isFinite(hotelLongitude);'''
          if old not in s: raise SystemExit('MyReservations coordinate variables missing')
          s=s.replace(old,'  const hotelAddress = row.hotels?.address || null;',1)
          old='''          {exactDestination ? (\n            <a\n              href={directionsUrl(hotelLatitude, hotelLongitude)}\n              target="_blank"\n              rel="noreferrer"\n              className="mt-4 flex min-h-11 items-center justify-center border-y border-violet-500/20 text-[10px] font-semibold text-violet-300"\n            >\n              Open road directions\n            </a>\n          ) : null}'''
          new='''          {hotelAddress ? (\n            <a\n              href={directionsUrl(hotelAddress)}\n              target="_blank"\n              rel="noreferrer"\n              className="mt-4 flex min-h-11 items-center justify-center border-y border-violet-500/20 text-[10px] font-semibold text-violet-300"\n            >\n              Open road directions\n            </a>\n          ) : null}'''
          if old not in s: raise SystemExit('MyReservations directions block missing')
          p.write_text(s.replace(old,new,1))
      - name: Remove one-use workflow
        run: rm .github/workflows/temporary-final-location-compile-fix.yml
      - name: Commit
        run: |
          git config user.name "forttunes2-droid"
          git config user.email "forttunes2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove stale customer coordinate paths"
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
