name: Temporary Fix Short Let Caution UI
on:
  push:
    branches:
      - codex/harden-main-resume-repairs-20260914
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/harden-main-resume-repairs-20260914
      - name: Make Short Let caution optional
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('src/components/PropertyInspectionRequestPanel.tsx')
          s=p.read_text()
          s=s.replace('''  securityDeposit: string;\n  maxGuests: string;''','''  cautionEnabled: boolean;\n  securityDeposit: string;\n  maxGuests: string;''')
          s=s.replace('''    securityDeposit: copy?.subType === "short_let" ? copy.securityDeposit : "",\n    maxGuests: copy?.subType === "short_let" ? copy.maxGuests || "" : "",''','''    cautionEnabled:\n      copy?.subType === "short_let"\n        ? copy.cautionEnabled ?? Boolean(copy.securityDeposit)\n        : false,\n    securityDeposit: copy?.subType === "short_let" ? copy.securityDeposit : "",\n    maxGuests: copy?.subType === "short_let" ? copy.maxGuests || "" : "",''')
          s=s.replace('''        (draft.propertyDisplayName.trim() &&\n          Number(draft.securityDeposit) > 0 &&\n          Number.isInteger(Number(draft.maxGuests)) &&''','''        (draft.propertyDisplayName.trim() &&\n          (!draft.cautionEnabled || Number(draft.securityDeposit) > 0) &&\n          Number.isInteger(Number(draft.maxGuests)) &&''')
          s=s.replace('''    draft.expectedRent.trim() ||\n    draft.securityDeposit.trim() ||''','''    draft.expectedRent.trim() ||\n    draft.cautionEnabled ||\n    draft.securityDeposit.trim() ||''')
          s=s.replace('''                d.subType === "short_let" &&\n                !Number(d.securityDeposit)\n              ? `Property ${invalid + 1}: add the refundable security deposit`''','''                d.subType === "short_let" &&\n                d.cautionEnabled &&\n                !Number(d.securityDeposit)\n              ? `Property ${invalid + 1}: add the refundable caution amount`''')
          s=s.replace('''          security_deposit_amount:\n            d.propertyType === "apartment" && d.subType === "short_let"\n              ? Number(d.securityDeposit)\n              : null,''','''          security_deposit_amount:\n            d.propertyType === "apartment" && d.subType === "short_let"\n              ? d.cautionEnabled\n                ? Number(d.securityDeposit)\n                : 0\n              : null,''')
          s=s.replace('''                              subType: "long_stay",\n                              securityDeposit: "",''','''                              subType: "long_stay",\n                              cautionEnabled: false,\n                              securityDeposit: "",''')
          old='''                        <Field\n                          label="Refundable security deposit *"\n                          inputMode="numeric"\n                          value={current.securityDeposit}\n                          set={(v) =>\n                            patch(active, { securityDeposit: digits(v) })\n                          }\n                        />'''
          new='''                        <section className="space-y-2">\n                          <p className="text-[10px] text-[#8A8B9C]">\n                            Refundable caution\n                          </p>\n                          <div className="grid grid-cols-2 gap-2">\n                            <button\n                              type="button"\n                              onClick={() =>\n                                patch(active, {\n                                  cautionEnabled: false,\n                                  securityDeposit: "",\n                                })\n                              }\n                              className={`rounded-xl border p-3 text-left ${!current.cautionEnabled ? "border-violet-500/35 bg-violet-500/10" : "border-white/[.07] bg-[#171821]"}`}\n                            >\n                              <span className="block text-[10px] font-semibold">No caution</span>\n                              <span className="mt-1 block text-[8px] text-[#777C8D]">Guest pays only the stay price</span>\n                            </button>\n                            <button\n                              type="button"\n                              onClick={() => patch(active, { cautionEnabled: true })}\n                              className={`rounded-xl border p-3 text-left ${current.cautionEnabled ? "border-violet-500/35 bg-violet-500/10" : "border-white/[.07] bg-[#171821]"}`}\n                            >\n                              <span className="block text-[10px] font-semibold">Use caution</span>\n                              <span className="mt-1 block text-[8px] text-[#777C8D]">Separate refundable property protection</span>\n                            </button>\n                          </div>\n                        </section>\n                        {current.cautionEnabled && (\n                          <Field\n                            label="Refundable caution amount *"\n                            inputMode="numeric"\n                            value={current.securityDeposit}\n                            set={(v) =>\n                              patch(active, { securityDeposit: digits(v) })\n                            }\n                          />\n                        )}'''
          if old not in s:
              raise SystemExit('caution field anchor not found')
          s=s.replace(old,new)
          s=s.replace('''                      Short Let apartments are furnished, priced per night and\n                      require a refundable property-specific security deposit.\n                      Set the maximum number of guests the apartment safely\n                      allows.''','''                      Short Let apartments are furnished and priced per night.\n                      A Property Partner may optionally enable a refundable caution amount.\n                      When caution is enabled, the guest can record pre-existing condition\n                      evidence during the booked 30–60 minute check-in window. Set the\n                      maximum number of guests the apartment safely allows.''')
          p.write_text(s)

          p=Path('tests/account-help-and-arrival-window.test.mjs')
          s=p.read_text()
          s=s.replace('supabase/migrations/20260916173000_account_help_and_arrival_minutes.sql','supabase/migrations/20260916173000_account_help_routing.sql')
          start=s.index('test("new Short Let and Hotel bookings use a 30-60 minute arrival-issue policy')
          end=s.index('test("Worker job-specific Message WeHouse keeps the 72-hour post-release shortcut"', start)
          replacement='''test("optional Short Let caution gets a 30-60 minute check-in evidence window without changing Hotels", async () => {\n  const [migration, form] = await Promise.all([\n    read("supabase/migrations/20260916173100_optional_short_let_caution_window.sql"),\n    read("src/components/PropertyInspectionRequestPanel.tsx"),\n  ]);\n  assert.match(migration, /short_let_caution_check_in_window/);\n  assert.match(migration, /'default_minutes',60,'minimum_minutes',30,'maximum_minutes',60/);\n  assert.match(migration, /This Short Let has no refundable caution amount/);\n  assert.match(migration, /Legacy already-checked-in stays retain the old four-hour evidence window/);\n  assert.doesNotMatch(migration, /alter table public\\.hotel_bookings/);\n  assert.doesNotMatch(migration, /set_hotel_arrival_deadline/);\n  assert.match(form, /cautionEnabled/);\n  assert.match(form, /No caution/);\n  assert.match(form, /Use caution/);\n  assert.match(form, /30–60 minute check-in window/);\n});\n\n'''
          s=s[:start]+replacement+s[end:]
          p.write_text(s)
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm -f .github/workflows/temporary-fix-short-let-caution-ui.yml
          git config user.name "WeHouse Short Let Caution Repair"
          git config user.email "actions@users.noreply.github.com"
          git add src/components/PropertyInspectionRequestPanel.tsx tests/account-help-and-arrival-window.test.mjs .github/workflows/temporary-fix-short-let-caution-ui.yml
          git commit -m "Make Short Let caution optional" || exit 0
          git push origin HEAD:codex/harden-main-resume-repairs-20260914
