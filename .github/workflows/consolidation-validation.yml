name: Consolidation Validation
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consolidation-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests-and-build:
    name: Consolidation Tests and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python tests/coordinated_release_aliases.py
      - run: npx tsc --noEmit
      - run: npm run build

  migration-replay:
    name: Consolidation Migration Replay
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ad077b4817fff9ecc3c1fd20d271ec351e2d7244 # v1.7.0
        with:
          version: 2.114.0
      - run: supabase --version
      - name: Reject duplicate migration versions
        shell: bash
        run: |
          duplicate_versions="$(find supabase/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)"
          if [ -n "$duplicate_versions" ]; then
            echo "Duplicate Supabase migration versions:"
            echo "$duplicate_versions"
            exit 1
          fi
      - name: Start local Supabase and apply migrations
        # Consolidation replay does not use Inbucket; avoid a shared runner port collision.
        run: node scripts/disposable-supabase.mjs start --exclude inbucket
      - name: Replay migrations from an empty database
        run: node scripts/disposable-supabase.mjs reset
      - name: Verify canonical schema exists
        shell: bash
        run: |
          test "$(docker exec supabase_db_wehouse psql -U postgres -d postgres -Atc "select count(*) from information_schema.tables where table_schema='public' and table_type='BASE TABLE';")" -ge 90
          test "$(docker exec supabase_db_wehouse psql -U postgres -d postgres -Atc "select count(*) from pg_proc p join pg_namespace n on n.oid=p.pronamespace where n.nspname='public';")" -ge 280
      - name: Exercise indexed public listing identifiers and visibility
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/public_detail_identifier_contract.sql
      - name: Exercise actual arrival dates and booking-code authority
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/arrival_dates_contract.sql
      - name: Exercise paid hotel cancellation and refund reconciliation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_paid_cancellation_contract.sql
      - name: Exercise guest-held hotel arrival and departure codes
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_guest_presence_contract.sql
      - name: Exercise accommodation handover contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/accommodation_handover_contract.sql
      - name: Exercise identity policy and Service Provider review contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/worker_face_review_contract.sql
      - name: Exercise atomic Message WeHouse first-send contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/support_first_send_contract.sql
      - name: Exercise payment cancellation and payout contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payment_cancellation_payout_contract.sql
      - name: Reject unsupported payment confirmations without manufacturing paid bookings
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/payment_confirmation_routing_contract.sql
      - name: Bind subscription event retries to the original verified account and receipt
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/subscription_event_replay_contract.sql
      - name: Exercise Creator booking and money policy authority
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_money_policy_contract.sql
      - name: Exercise reviewed legal signup and acceptance contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/legal_review_contract.sql
      - name: Exercise Creator bootstrap and platform controls
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/creator_controls_contract.sql
      - name: Exercise Creator dashboard and identity policy
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/creator_dashboard_identity_contract.sql
      - name: Exercise team grants and private evidence access
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/team_evidence_contract.sql
      - name: Exercise team scope and Operation capacity
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/team_scope_capacity_contract.sql
      - name: Exercise identity routing, Partner gate and Worker services
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/identity_partner_service_contract.sql
      - name: Exercise Worker Operations and Admin canonical identity
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/worker_operations_and_admin_identity_contract.sql
      - name: Exercise post-82 profile and Worker summary repair
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/post82_profile_summary_contract.sql
      - name: Exercise canonical Activity routing and least privilege
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/canonical_activity_domain_contract.sql
      - name: Exercise operational conversation lane separation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/operational_conversation_bundle_contract.sql
      - name: Exercise property routing inventory and revoked hotel Activity
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_workspace_routing_contract.sql
      - name: Exercise Partner Pro ownership, task mutation and calendar isolation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_partner_pro_contract.sql
      - name: Exercise Worker Pro business records, paid access and ownership
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/worker_pro_business_contract.sql
      - name: Exercise Partner Pro terms, checkout and verified entitlement
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/partner_pro_payment_contract.sql
      - name: Exercise work-post comment pagination and hidden-post isolation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/worker_showcase_comment_pages_contract.sql
      - name: Hotel conversation context and recipient receipts
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_conversation_context_contract.sql
      - name: Hotel base tables are not directly readable or writable by browser roles
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_base_table_exposure_contract.sql
      - name: Case routing and private reply receipts
        # Support contracts exercise the same current Auth/device and case routing authority.
        run: |
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/support_reply_receipt_contract.sql
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/case_routing_catalog_contract.sql
      - name: Assigned inspection submission, evidence review and recovery
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/inspection_command_authority_contract.sql
      - name: Finance action authority, held funds and stable provider references
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/finance_action_receipt_contract.sql
      - name: Booking arrival authority and negative access boundaries
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/booking_arrival_boundary_contract.sql
      - name: Service booking command session authority
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/service_command_session_contract.sql
      - name: Experience application evidence and exact Creator booking authority
        run: |
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/experience_application_contract.sql
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/creator_exact_booking_contract.sql
      - name: Friend relationship and payer cap
        run: |
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/friend_relationship_contract.sql
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/friend_recipient_preview_contract.sql
          docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/email_account_security_contract.sql
      - name: Friend bucket and encrypted chat
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/friend_bucket_and_chat_contract.sql
      - name: Friend request expiry and daily cap
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/friend_request_limits_contract.sql
      - name: Friend chat key exchange
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/friend_chat_key_exchange_contract.sql
      - name: Long Let shared booking cost with Roommate or Friend
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/long_let_split_roommate_or_friend_contract.sql
      - name: Wallet withdrawal receipts and payout destination isolation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/wallet_withdrawal_receipt_contract.sql
      - name: Shared content reports and scoped moderation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/shared_content_reports_contract.sql
      - name: Hotel reports, private receipts and geographic review boundaries
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_listing_reports_contract.sql
      - name: Property and Hotel submission fact validation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_submission_facts_contract.sql
      - name: Verify internal listing bypass retirement
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/internal_listing_retirement_contract.sql
      - name: Private property documents and publication boundaries
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_document_review_contract.sql
      - name: Partner Pro costs, ownership and reporting boundaries
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/partner_operating_costs_contract.sql
      - name: Roommate cancel connection wait
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/roommate_cancel_wait_contract.sql
      - name: Roommate cancel connection notice
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/roommate_cancel_notice_contract.sql
      - name: Listing discount rules
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/listing_discounts_contract.sql
      - name: Pinned messages and discount breakdown
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/message_pins_contract.sql
      - name: Fixed fee and withdrawal controls
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/fixed_fee_and_withdrawal_controls_contract.sql
      - name: Service Worker refund rules
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/worker_refund_rules_contract.sql
      - name: Hotel discounts
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/hotel_discounts_contract.sql
      - name: Short Let cancel and email change
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cancel_and_email_change_contract.sql
      - name: Country settings
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/country_settings_contract.sql
      - name: Practical reciprocal roommate rules
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/practical_roommate_contract.sql
      - name: Fresh linked-provider recovery
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/recovery_freshness_contract.sql
      - name: Creator worker-publication authority
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/creator_worker_publication_contract.sql
      - name: Shared Short Let reservation and payments
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/short_let_shared_review_contract.sql
      - name: Exercise privileged RPC write guards
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/security_definer_write_guard_contract.sql
      - name: Exercise workspace grants, revocation and geographic scope
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/workspace_authority_contract.sql
      - name: Exercise recorded Creator and receipt journeys as authenticated users
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/recorded_journeys_contract.sql
      - name: Exercise private call trusted devices, preferences and signal isolation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/private_call_session_contract.sql
      - name: Exercise compound and physical-space submission authority
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_space_identity_contract.sql
      - name: Exercise workspace inbox separation and revocation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/workspace_inbox_contract.sql
      - name: Exercise Help payment eligibility and workspace isolation
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/workspace_help_payment_contract.sql
      - name: Exercise hotel and property first-send workspace routing
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/support_topic_workspace_contract.sql
      - name: Verify signup hook through Supabase Auth
        run: node scripts/verify-signup-legal-hook.mjs
      - name: Exercise cross-user RLS foundation contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/foundation_rls_contract.sql
      - name: Exercise invitations, Hosting Help and Worker market capacity
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/marketplace_controls_contract.sql
      - name: Verify prepublication management choice and public media bounds
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/property_management_publication_contract.sql
      - name: Verify active co-host access and invitation retry controls
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/cohost_invitation_control_contract.sql
      - name: Exercise Sponsored payment and placement contract
        run: docker exec -i supabase_db_wehouse psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/sponsored_paid_placement_contract.sql
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  existing-account-upgrade:
    name: Existing Account Upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PGHOST: 127.0.0.1
      PGPORT: '54322'
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Set up pinned Supabase CLI
        uses: supabase/setup-cli@ad077b4817fff9ecc3c1fd20d271ec351e2d7244 # v1.7.0
        with:
          version: 2.114.0
      - run: supabase --version
      - name: Start disposable local Supabase
        run: node scripts/disposable-supabase.mjs start
      - name: Load the current production baseline
        run: node scripts/disposable-supabase.mjs reset --version 20260913181317
      - name: Seed existing approvals, reviews, private evidence and a wallet
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/existing_account_upgrade_fixture.sql
      - name: Verify the full upgrade rolls back without changing records or history
        run: python scripts/coordinated-database-release.py check --local-ci
      - name: Verify the full upgrade commits with existing records preserved
        run: python scripts/coordinated-database-release.py apply --local-ci
      - name: Reject overlapping payouts without blocking later requests
        run: psql -X -v ON_ERROR_STOP=1 -f supabase/tests/withdrawal_single_open_contract.sql
      - name: Verify a repeated release is a no-op
        run: python scripts/coordinated-database-release.py apply --local-ci
      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup

  consolidation-gate:
    name: Consolidation Validation
    if: always()
    needs: [tests-and-build, migration-replay, existing-account-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require build and migration replay
        env:
          BUILD_RESULT: ${{ needs.tests-and-build.result }}
          MIGRATION_RESULT: ${{ needs.migration-replay.result }}
          UPGRADE_RESULT: ${{ needs.existing-account-upgrade.result }}
        run: |
          test "$BUILD_RESULT" = "success"
          test "$MIGRATION_RESULT" = "success"
          test "$UPGRADE_RESULT" = "success"
