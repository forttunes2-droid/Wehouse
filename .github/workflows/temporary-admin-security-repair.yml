name: Temporary Admin Security Repair

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - run: python scripts/temporary_admin_security_repair.py
      - name: Commit Admin security structure
        shell: bash
        run: |
          if git diff --quiet -- src/pages/AdminDashboard.tsx; then
            echo "Admin security structure already current."
            exit 0
          fi
          git config user.name "WeHouse Security Structure"
          git config user.email "actions@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx
          git commit -m "Add Admin Security escalation workspace"
          git push origin HEAD:${{ github.head_ref }}
