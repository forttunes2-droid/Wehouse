name: Experience browser check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: experience-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Run isolated browser interactions
        run: |
          node node_modules/vite/bin/vite.js --config tests/browser/vite.config.ts > /tmp/wehouse-browser-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/tests/browser/experience.html >/dev/null && break
            sleep 1
          done
          python tests/browser/experience.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-browser-results
          path: test-results/experience
          retention-days: 7
