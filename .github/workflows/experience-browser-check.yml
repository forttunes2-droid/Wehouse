name: Experience browser check
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: experience-browser-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retain exact reviewed source
        run: |
          python - <<'PY'
          import pathlib, subprocess, tarfile
          output = pathlib.Path('test-results/review-source')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'reviewed-commit.txt').write_text(subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True))
          prefixes = ('public/', 'src/', 'tests/', 'supabase/migrations/', 'supabase/tests/', '.github/workflows/')
          configs = {'package.json', 'package-lock.json', 'vite.config.ts', 'tsconfig.json', 'tsconfig.node.json', 'tsconfig.app.json', 'tailwind.config.js', 'tailwind.config.ts', 'postcss.config.js', 'postcss.config.cjs', 'eslint.config.js', 'index.html'}
          names = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          with tarfile.open(output / 'review-source.tar.gz', 'w:gz') as bundle:
              for name in names:
                  path = pathlib.Path(name)
                  if not name or not path.is_file() or path.is_symlink():
                      continue
                  if any(part.startswith('.env') for part in path.parts):
                      continue
                  if name.startswith(prefixes) or name in configs:
                      bundle.add(path, arcname=name, recursive=False)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-source
          path: test-results/review-source
          retention-days: 3
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - name: Run isolated browser interactions
        run: |
          node node_modules/vite/bin/vite.js --config tests/browser/vite.config.ts > /tmp/wehouse-browser-vite.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:4173/tests/browser/experience.html >/dev/null && break
            sleep 1
          done
          failed=0
          for test in message_attachments workspace_repair property_experience property_link property_routing experience welcome-layout communication-stability overview_arrival login_entry profile_help message_swipe entry_help_availability; do
            python "tests/browser/$test.py" || failed=1
          done
          test "$failed" = 0
      - name: Verify real bundle startup failures remain safe and recoverable
        if: ${{ !cancelled() }}
        env:
          VITE_SUPABASE_URL: https://rkrhnkhppeihvmuwvsvn.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_guard_test
        run: |
          # Deliberately unsafe for localhost: the production guard must block it
          # before any database request, and the independent startup shell must render.
          node node_modules/vite/bin/vite.js build --outDir test-results/startup-bundle
          python -m http.server 4321 --bind 127.0.0.1 --directory test-results/startup-bundle > /tmp/wehouse-startup-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for attempt in $(seq 1 15); do
            curl --fail --silent http://127.0.0.1:4321 >/dev/null && break
            sleep 1
          done
          python tests/browser/startup_bundle.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experience-browser-results
          path: test-results/experience
          retention-days: 7
