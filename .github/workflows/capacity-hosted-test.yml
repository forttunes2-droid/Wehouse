name: Capacity hosted Test catalog (bounded)
on:
  # Hosted load consumes the shared Test environment. Run deliberately, rather
  # than repeating the same heavy ramp for every unrelated booking migration.
  workflow_dispatch:
    inputs:
      max_rps:
        description: 'Read-only Test ceiling; each lower stage must pass first'
        type: choice
        options: ['200', '500', '1000']
        default: '1000'

permissions:
  contents: read

concurrency:
  group: capacity-hosted-test
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check capacity report gates
        run: node --test tests/catalog-capacity-gates.test.mjs tests/catalog-transport.test.mjs tests/catalog-ramp.test.mjs
      - name: Read-only Test project catalog ramp
        env:
          # A browser-safe publishable key for the dedicated Test project. RLS
          # protects underlying tables; the runner never receives a secret key.
          WEHOUSE_TEST_PUBLISHABLE_KEY: sb_publishable_Rv3lT3wV3AVqWIlxM3Dygw_E3q_aSlV
          WEHOUSE_CATALOG_MAX_RPS: ${{ inputs.max_rps || '1000' }}
        run: node scripts/load-hosted-test-catalog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-hosted-test-results
          path: test-results/hosted-test-catalog.json
          retention-days: 14
  distributed:
    needs: catalog
    if: ${{ needs.catalog.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run independent Test catalog generator
        env:
          WEHOUSE_TEST_PUBLISHABLE_KEY: sb_publishable_Rv3lT3wV3AVqWIlxM3Dygw_E3q_aSlV
          WEHOUSE_CATALOG_MAX_RPS: '200'
          WEHOUSE_CATALOG_SHARD_ID: ${{ matrix.shard }}
        run: node scripts/load-hosted-test-catalog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: catalog-shard-${{ matrix.shard }}
          path: test-results/hosted-test-catalog.json
          retention-days: 14
  distributed-summary:
    needs: distributed
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/distributed-catalog-gates.test.mjs
      - uses: actions/download-artifact@v4
        with:
          pattern: catalog-shard-*
          path: test-results/distributed-catalog
      - run: node scripts/summarize-distributed-catalog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: distributed-catalog-summary
          path: test-results/distributed-catalog-summary.json
          retention-days: 14
