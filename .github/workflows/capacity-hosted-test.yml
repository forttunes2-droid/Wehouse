name: Capacity hosted Test catalog (bounded)
on:
  # Hosted load consumes the shared Test environment. Run deliberately, rather
  # than repeating load for every unrelated booking migration. The shared Free
  # project permits one low-rate generator; expansion needs a provisioned setup.
  workflow_dispatch:
    inputs:
      max_rps:
        description: 'Read-only Test ceiling; each lower stage must pass first'
        type: choice
        options: ['1', '5', '10']
        default: '1'

permissions:
  contents: read

concurrency:
  group: capacity-hosted-test
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check capacity report gates
        run: node --test tests/catalog-capacity-gates.test.mjs tests/catalog-transport.test.mjs tests/catalog-ramp.test.mjs
      - name: Read-only Test project catalog ramp
        env:
          # A browser-safe publishable key for the dedicated Test project. RLS
          # protects underlying tables; the runner never receives a secret key.
          WEHOUSE_TEST_PUBLISHABLE_KEY: sb_publishable_Rv3lT3wV3AVqWIlxM3Dygw_E3q_aSlV
          WEHOUSE_CATALOG_MAX_RPS: ${{ inputs.max_rps || '1' }}
        run: node scripts/load-hosted-test-catalog.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capacity-hosted-test-results
          path: test-results/hosted-test-catalog.json
          retention-days: 14
