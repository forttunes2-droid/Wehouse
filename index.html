    <!-- Phase 4 Worker-system build marker -->
    <script>window.WH_VERSION='20260815-phase4';</script>
    <script>
      (function() {
        // One-time compatibility cleanup: Property Partner is the only
        // canonical Partner workspace. Never restore the retired owner alias.
        try {
          if (localStorage.getItem('wh_navpage') === 'property_owner') {
            localStorage.setItem('wh_navpage', 'property_partner');
          }
          if (window.history.state && window.history.state.page === 'property_owner') {
            window.history.replaceState({ page: 'property_partner' }, '', '#property_partner');
          }
        } catch (_) {}
      })();
    </script>
    <script>
      (function() {
        if (!('serviceWorker' in navigator)) return;
        if (sessionStorage.getItem('sw_done')) return;
        if (!navigator.serviceWorker.controller) return;
        navigator.serviceWorker.register('/sw.js').then(function() {
          sessionStorage.setItem('sw_done', '1');
        }).catch(function() {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            Promise.all(regs.map(function(r) { return r.unregister(); }));
          });
        });
      })();
    </script>
