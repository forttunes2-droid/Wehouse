<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="background-color" content="#0A0A0F" />
    <meta name="description" content="WeHouse - Find houses, connect with roommates, hire verified workers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeHouse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WeHouse" />
    <meta name="msapplication-TileColor" content="#0A0A0F" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="preload" href="/brand/v4/wehouse-app-icon.svg" as="image" type="image/svg+xml" />
    <link rel="icon" type="image/svg+xml" href="/brand/v4/wehouse-app-icon-micro.svg" />
    <link rel="manifest" href="/manifest.webmanifest?v=4" />
    <link rel="apple-touch-icon" href="/brand/v4/app-icon-256.png" />
    <link rel="mask-icon" href="/brand/v4/wehouse-symbol-black.svg" color="#7C3AED" />

    <title>WeHouse</title>
    <style>
      :root { --wh-startup-bg: #0E0C12; --wh-startup-text: #F6F2FC; --wh-startup-muted: #AAA3B3; }
      :root[data-wh-theme="light"] { --wh-startup-bg: #F7F8FB; --wh-startup-text: #202433; --wh-startup-muted: #596376; }
      html, body { margin: 0; min-height: 100%; background: #090B10; }
      html[data-wh-theme="light"], html[data-wh-theme="light"] body { background: #F7F8FB; }
      body { min-height: 100dvh; }
      .safe-area-top { padding-top: env(safe-area-inset-top); }
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
      #wh-bootstrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: var(--wh-startup-text);
        background: var(--wh-startup-bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #wh-bootstrap-inner { text-align: center; }
      #wh-bootstrap-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: block;
        margin: 0 auto;
      }
      #wh-bootstrap-name { margin: 16px 0 0; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
      #wh-bootstrap-tagline { margin: 6px 0 0; color: var(--wh-startup-muted); font-size: 13px; letter-spacing: .04em; }
      #wh-bootstrap-loader {
        width: 22px;
        height: 22px;
        margin: 20px auto 0;
        border: 2px solid rgba(167,139,250,.22);
        border-top-color: #A78BFA;
        border-radius: 999px;
        animation: wh-spin .8s linear infinite;
      }
      @keyframes wh-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #wh-bootstrap-loader { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wh-bootstrap" role="status" aria-label="Opening WeHouse">
        <div id="wh-bootstrap-inner">
          <img id="wh-bootstrap-logo" src="/brand/v4/wehouse-app-icon.svg" alt="" />
          <p id="wh-bootstrap-name">WeHouse</p>
          <p id="wh-bootstrap-tagline">find · connect · live better</p>
          <div id="wh-bootstrap-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script src="/bootstrap.js?v=__WH_VERSION__"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
