<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0A0F" />
    <meta name="background-color" content="#0A0A0F" />
    <meta name="description" content="WeHouse - Find houses, connect with roommates, hire verified workers" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="WeHouse" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="WeHouse" />
    <meta name="msapplication-TileColor" content="#0A0A0F" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link rel="preload" href="/app-icon.svg?v=3" as="image" type="image/svg+xml" />
    <link rel="icon" type="image/svg+xml" href="/brand-mark-light.svg?v=3" />
    <link rel="manifest" href="/manifest.webmanifest?v=3" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <link rel="mask-icon" href="/brand-mask.svg?v=3" color="#7C3AED" />

    <title>WeHouse</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0A0A0F; }
      body { min-height: 100dvh; }
      .safe-area-top { padding-top: env(safe-area-inset-top); }
      .safe-area-bottom { padding-bottom: env(safe-area-inset-bottom); }
      #wh-bootstrap {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        color: #fff;
        background:
          radial-gradient(circle at 50% 38%, rgba(124,58,237,.20), transparent 28%),
          #0A0A0F;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #wh-bootstrap-inner { text-align: center; }
      #wh-bootstrap-logo {
        width: 48px;
        height: 48px;
        border-radius: 14px;
        display: block;
        margin: 0 auto;
        box-shadow: 0 14px 40px rgba(124,58,237,.22);
      }
      #wh-bootstrap-name { margin: 14px 0 0; font-size: 18px; font-weight: 750; letter-spacing: -.02em; }
      #wh-bootstrap-tagline { margin: 6px 0 0; color: #777D8D; font-size: 11px; letter-spacing: .04em; }
      #wh-bootstrap-loader {
        width: 22px;
        height: 22px;
        margin: 20px auto 0;
        border: 2px solid rgba(167,139,250,.22);
        border-top-color: #A78BFA;
        border-radius: 999px;
        animation: wh-spin .8s linear infinite;
      }
      @keyframes wh-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #wh-bootstrap-loader { animation: none; } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="wh-bootstrap" role="status" aria-label="Opening WeHouse">
        <div id="wh-bootstrap-inner">
          <img id="wh-bootstrap-logo" src="/app-icon.svg?v=3" alt="" />
          <p id="wh-bootstrap-name">WeHouse</p>
          <p id="wh-bootstrap-tagline">find · connect · live better</p>
          <div id="wh-bootstrap-loader" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/preflight.ts"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
